    }
  });

  /* =====================================================================
     หลังบ้าน: เช็คชื่อทั้งกิลด์ (หน้าเต็ม) — เลือกกิจกรรม+วัน, ค้นหาชื่อ, มา/สาย/ขาด/ลา, บันทึกอัตโนมัติ
     ===================================================================== */
  var ATD = {activity:'Siege', date:'', roster:[], marks:{}, leaves:{}, q:'', f:'all', pending:{}, timer:null, saving:false, saveState:'', loaded:false};
  var ATT_ACTS = ['Siege','Guild League','Polarity Zone'];
  function guildToday(){ return new Date(Date.now()+7*3600000).toISOString().slice(0,10); }
  function atShift(d,n){ var t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()+n); return t.toISOString().slice(0,10); }
  function loadAtt(){
    if(!ATD.date) ATD.date=guildToday();
    atFlush(function(){ atFetch(); });
  }
  function atFetch(){
    callQuiet('adminGetAttendanceAll',[ATD.activity,ATD.date],function(r){
      if(!r.ok){ errView(r.message); return; }
      ATD.roster=r.roster; ATD.marks=r.marks||{}; ATD.leaves=r.leaves||{}; ATD.pending={}; ATD.saveState=''; ATD.loaded=true;
      atRender();
    },function(err){ errView('โหลดไม่สำเร็จ: '+(err&&err.message?err.message:err)); });
  }
  function atStatus(name){ return ATD.marks[name.toLowerCase()]||''; }
  function atCounts(){
    var c={all:ATD.roster.length,'':0,'มา':0,'สาย':0,'ขาด':0,'ลา':0};
    ATD.roster.forEach(function(x){ c[atStatus(x.name)]++; });
    return c;
  }
  function atRowHtml(x){
    var st=atStatus(x.name), lv=ATD.leaves[x.name.toLowerCase()];
    var btn=[['มา','ok'],['สาย','lt'],['ขาด','ab'],['ลา','lv']].map(function(b){
      return '<button type="button" class="'+b[1]+(st===b[0]?' on':'')+(!st&&lv&&b[0]==='ลา'&&lv!=='late'?' sug':'')+'" data-at="'+b[0]+'">'+b[0]+'</button>';
    }).join('');
    return '<div class="atp-row'+(st?' s-'+st:'')+'" data-n="'+esc(x.name)+'" data-q="'+esc((x.name+' '+x.job).toLowerCase())+'"'+jobStyle(x.job)+'>'
      +'<div class="atp-nm">'+jobIcon(x.job)+'<b class="jn">'+esc(x.name)+'</b>'+(x.job&&!jobInfo(x.job)?' <small>'+esc(x.job)+'</small>':'')
      +(x.placed?'<span class="atp-tag">จัดตี้</span>':'')
      +(lv==='late'?'<span class="atp-tag late" title="แจ้งลาหลังเลยเวลาปิดรับ ทีมงานตัดสินเองว่าเป็นลาหรือขาด">แจ้งลาช้า</span>':(lv?'<span class="atp-tag">แจ้งลา</span>':''))+'</div>'
      +'<div class="atp-b">'+btn+'</div></div>';
  }
  function atRender(){
    var c=atCounts();
    var acts=ATT_ACTS.map(function(a){ return '<button type="button" data-a="at-act" data-v="'+esc(a)+'" class="'+(a===ATD.activity?'on':'')+'">'+esc(a)+'</button>'; }).join('');
    var chips=[['all','ทั้งหมด',c.all],['','ยังไม่เช็ค',c['']],['มา','มา',c['มา']],['สาย','สาย',c['สาย']],['ขาด','ขาด',c['ขาด']],['ลา','ลา',c['ลา']]].map(function(x){
      return '<button type="button" class="atp-chip'+(ATD.f===x[0]?' on':'')+'" data-a="at-f" data-v="'+x[0]+'">'+x[1]+' <b>'+x[2]+'</b></button>';
    }).join('');
    var rows=ATD.roster.map(atRowHtml).join('');
    content().innerHTML=
      '<div class="ad-card"><h3>✅ เช็คชื่อกิจกรรม</h3>'
      +'<div class="atp-head"><div><div class="meta" style="margin-bottom:4px">กิจกรรม</div><div class="seg" id="atActs">'+acts+'</div></div>'
      +'<div class="field"><label for="atDate">วันที่</label><input id="atDate" type="date" value="'+esc(ATD.date)+'"></div>'
      +'<div class="btnrow" style="margin:0"><button type="button" class="mini" data-a="at-day" data-v="-1">◀ วันก่อน</button><button type="button" class="mini" data-a="at-day" data-v="0">วันนี้</button><button type="button" class="mini" data-a="at-day" data-v="1">วันถัดไป ▶</button></div></div>'
      +'<p class="gp-desc" style="margin-top:8px">แสดงสมาชิกทั้งกิลด์ ('+c.all+' คน) กดสถานะได้เลย ระบบบันทึกให้อัตโนมัติ · คนที่แจ้งลาไว้จะมีป้ายกำกับ แล้วกดปุ่ม "ลา" เพื่อยืนยัน</p></div>'
      +'<div class="atp-bar"><input id="atQ" type="search" autocomplete="off" placeholder="🔍 พิมพ์ค้นหาชื่อตัวละคร หรืออาชีพ" value="'+esc(ATD.q)+'">'
      +'<div class="atp-chips" id="atChips">'+chips+'<span class="atp-save" id="atSave"></span></div>'
      +'<div class="atp-chips"><button type="button" class="mini" data-a="at-auto">เติมอัตโนมัติ: คนแจ้งลา = ลา</button>'
      +'<button type="button" class="mini" data-a="at-rest" data-v="มา">ที่ยังไม่เช็ค (ตามที่แสดง) → มา</button>'
      +'<button type="button" class="mini danger" data-a="at-rest" data-v="ขาด">ที่ยังไม่เช็ค (ตามที่แสดง) → ขาด</button></div></div>'
      +'<div class="atp-list" id="atList">'+rows+'</div><div class="empty" id="atNone" style="display:none;padding:16px">ไม่พบรายชื่อที่ตรงกับการค้นหา</div>';
    var q=document.getElementById('atQ'); q.addEventListener('input', function(){ ATD.q=q.value; atApplyFilter(); });
    document.getElementById('atDate').addEventListener('change', function(){ if(this.value){ atFlush(function(){ ATD.date=document.getElementById('atDate').value; atFetch(); }); } });
    atApplyFilter(); atPaintSave();
  }
  function atApplyFilter(){
    var q=ATD.q.trim().toLowerCase(), shown=0;
    Array.prototype.forEach.call(document.querySelectorAll('#atList .atp-row'), function(r){
      var nm=r.getAttribute('data-n'), st=atStatus(nm);
      var hit=(!q || r.getAttribute('data-q').indexOf(q)!==-1) && (ATD.f==='all' || st===ATD.f);
      r.style.display=hit?'':'none'; if(hit) shown++;
    });
    var none=document.getElementById('atNone'); if(none) none.style.display=shown?'none':'';
  }
  function atRefreshChips(){
    var c=atCounts(), el=document.getElementById('atChips'); if(!el) return;
    Array.prototype.forEach.call(el.querySelectorAll('.atp-chip'), function(b){
      var v=b.getAttribute('data-v'), n=v==='all'?c.all:c[v];
      b.querySelector('b').textContent=n;
    });
  }
  function atPaintSave(){
    var el=document.getElementById('atSave'); if(!el) return;
    var np=Object.keys(ATD.pending).length;
    el.className='atp-save';
    if(ATD.saveState==='bad'){ el.className='atp-save bad'; el.setAttribute('data-a','at-retry'); el.textContent='⚠ บันทึกไม่สำเร็จ กดเพื่อลองใหม่ ('+np+' รายการค้าง)'; }
    else if(ATD.saving||np){ el.textContent='กำลังบันทึก…'; }
    else if(ATD.saveState==='ok'){ el.className='atp-save ok'; el.textContent='✓ บันทึกแล้ว'; }
    else el.textContent='';
  }
  function atMark(name,status){
    var k=name.toLowerCase(), cur=ATD.marks[k]||'';
    var nx=(cur===status)?'':status;
    if(nx) ATD.marks[k]=nx; else delete ATD.marks[k];
    ATD.pending[name]=nx;
    var row=document.querySelector('#atList .atp-row[data-n="'+name.replace(/"/g,'\\"')+'"]');
    if(row){
      row.className='atp-row'+(nx?' s-'+nx:'');
      Array.prototype.forEach.call(row.querySelectorAll('button[data-at]'), function(b){ b.classList.toggle('on', b.getAttribute('data-at')===nx); if(nx) b.classList.remove('sug'); });
    }
    atRefreshChips(); atQueue();
  }
  function atQueue(){ ATD.saveState=''; atPaintSave(); clearTimeout(ATD.timer); ATD.timer=setTimeout(function(){ atFlush(); }, 700); }
  function atFlush(cb){
    clearTimeout(ATD.timer);
    var names=Object.keys(ATD.pending);
    if(!names.length || ATD.saving){
      if(ATD.saving && cb){ setTimeout(function(){ atFlush(cb); }, 300); return; }
      if(cb) cb(); return;
    }
    var marks=names.map(function(n){ return {name:n,status:ATD.pending[n]}; }), sent={};
    names.forEach(function(n){ sent[n]=ATD.pending[n]; });
    ATD.saving=true; atPaintSave();
    var act=ATD.activity, date=ATD.date;
    callQuiet('adminSaveAttendance',[act,date,marks,true],function(r){
      ATD.saving=false;
      if(r.ok){ names.forEach(function(n){ if(ATD.pending[n]===sent[n]) delete ATD.pending[n]; }); ATD.saveState=Object.keys(ATD.pending).length?'':'ok'; }
      else { ATD.saveState='bad'; notice(false,r.message); }
      atPaintSave();
      if(Object.keys(ATD.pending).length && r.ok) atFlush(cb); else if(cb && r.ok) cb();
    },function(){ ATD.saving=false; ATD.saveState='bad'; atPaintSave(); });
  }
  document.getElementById('adBody').addEventListener('click', function(e){
    if(CUR_TAB!=='att') return;
    var t=e.target.closest('[data-at]');
    if(t){ var row=t.closest('.atp-row'); if(row) atMark(row.getAttribute('data-n'), t.getAttribute('data-at')); return; }
    var b=e.target.closest('[data-a]'); if(!b) return;
    var a=b.dataset.a;
    if(a==='at-act'){ atFlush(function(){ ATD.activity=b.dataset.v; atFetch(); }); }
    else if(a==='at-day'){
      var v=Number(b.dataset.v); atFlush(function(){ ATD.date = v===0 ? guildToday() : atShift(ATD.date||guildToday(), v); atFetch(); });
    }
    else if(a==='at-f'){ ATD.f=b.dataset.v; Array.prototype.forEach.call(document.querySelectorAll('#atChips .atp-chip'), function(x){ x.classList.toggle('on', x.getAttribute('data-v')===ATD.f); }); atApplyFilter(); }
    else if(a==='at-retry'){ atFlush(); }
    else if(a==='at-auto'){
      ATD.roster.forEach(function(x){ var lv=ATD.leaves[x.name.toLowerCase()]; if(!atStatus(x.name) && lv && lv!=='late') atMark(x.name,'ลา'); });
    } else if(a==='at-rest'){
      var st=b.dataset.v, list=[];
      Array.prototype.forEach.call(document.querySelectorAll('#atList .atp-row'), function(r){ if(r.style.display!=='none' && !atStatus(r.getAttribute('data-n'))) list.push(r.getAttribute('data-n')); });
      if(!list.length){ notice(false,'ไม่มีรายชื่อที่ยังไม่เช็คในรายการที่แสดงอยู่'); return; }
      twoStep(b,function(){ list.forEach(function(n){ atMark(n,st); }); });
    }
  });
  window.addEventListener('beforeunload', function(e){ if(Object.keys(ATD.pending).length){ e.preventDefault(); e.returnValue=''; } });

  /* ===== หลังบ้าน: ทีมงานจัดตี้ประจำให้สมาชิก ===== */
  var GPA = {parties:[], members:[], deleted:[], dirty:false};
  function gpaLoc(p){ return {id:p.id, name:p.name, version:p.version, members:p.members.slice(), isNew:false, orig:JSON.stringify([p.name.trim(),p.members])}; }
  function gpaIsDirty(p){ return p.isNew ? p.members.length>0 : JSON.stringify([p.name.trim(),p.members])!==p.orig; }
  function loadGpa(){
    call('adminListGuildParties',[],function(r){
      if(!r.ok){ errView(r.message); return; }
      GPA.members=r.members||[]; GPA.parties=(r.parties||[]).map(gpaLoc); GPA.deleted=[]; gpaRender();
    });
  }
  function gpaUsed(){ var o={}; GPA.parties.forEach(function(p){ p.members.forEach(function(n){ o[n.toLowerCase()]=1; }); }); return o; }
  function gpaFree(){ var u=gpaUsed(); return GPA.members.filter(function(m){ return !u[m.name.toLowerCase()]; }); }
  function gpaRender(){
    var free=gpaFree();
    var cards=GPA.parties.map(function(p,i){
      var chips=p.members.map(function(n,s){
        return '<span class="gpa-chip">'+(s===0?'★ ':'')+jobIcon(gpaJob(n))+esc(n)+'<button type="button" data-ga="rm" data-i="'+i+'" data-s="'+s+'" title="เอาออก">×</button></span>';
      }).join('');
      var add=p.members.length<5 ? '<div class="gpa-add"><input list="gpaDl" data-gi="'+i+'" autocomplete="off" placeholder="＋ พิมพ์ชื่อเพื่อเพิ่มเข้าตี้นี้ ('+p.members.length+'/5)"></div>' : '<div class="meta">ตี้เต็มแล้ว (5/5)</div>';
      return '<div class="gpa-card'+(gpaIsDirty(p)?' dirty':'')+'" data-gc="'+i+'"><div class="gpa-top"><input data-gn="'+i+'" maxlength="30" placeholder="ชื่อตี้ (ไม่บังคับ)" value="'+esc(p.name)+'">'
        +'<button type="button" class="mini danger" data-ga="del" data-i="'+i+'">🗑 ลบตี้</button></div><div class="gpa-mem">'+chips+'</div>'+add+'</div>';
    }).join('');
    content().innerHTML='<div class="ad-card"><h3>🔗 จัดตี้ประจำให้สมาชิก</h3>'
      +'<p class="gp-desc">ใช้เมื่อสมาชิกขอให้ทีมงานจัดตี้ให้ แต่เขายังไม่ได้จัดเอง · คนแรกคือหัวตี้ · สูงสุด 5 คน · 1 คนอยู่ได้ตี้เดียว · ยังไม่มีตี้ประจำ <b>'+free.length+'</b> คน</p>'
      +'<datalist id="gpaDl">'+free.map(function(m){ return '<option value="'+esc(m.name)+'">'+esc(m.job)+'</option>'; }).join('')+'</datalist>'
      +'<div id="gpaCards">'+cards+'</div>'
      +'<div class="btnrow"><button type="button" class="mini" data-ga="new">＋ สร้างตี้ใหม่</button><button type="button" class="btn" id="gpaSave" data-ga="save" style="width:auto;padding:10px 22px">บันทึก</button></div><div class="msg" id="gpaMsg" role="status"></div></div>';
  }
  function gpaJob(n){ var q=String(n).toLowerCase(); for(var i=0;i<GPA.members.length;i++){ if(GPA.members[i].name.toLowerCase()===q) return GPA.members[i].job; } return ''; }
  function gpaMsg(ok,t){ var m=document.getElementById('gpaMsg'); if(m){ m.className='msg '+(ok?'ok':'bad'); m.textContent=t; } }
  document.getElementById('adBody').addEventListener('click', function(e){
    if(CUR_TAB!=='gpa') return;
    var b=e.target.closest('[data-ga]'); if(!b) return;
    var a=b.dataset.ga, i=Number(b.dataset.i), p=GPA.parties[i];
    if(a==='new'){ GPA.parties.push({id:'',name:'',version:0,members:[],isNew:true,orig:''}); gpaRender(); }
    else if(a==='rm'){ p.members.splice(Number(b.dataset.s),1); gpaRender(); }
    else if(a==='del'){ twoStep(b,function(){ if(!p.isNew) GPA.deleted.push({id:p.id,version:p.version}); GPA.parties.splice(i,1); gpaRender(); }); }
    else if(a==='save'){
      var ups=[]; GPA.parties.forEach(function(q){ if(gpaIsDirty(q)) ups.push({id:q.isNew?'':q.id,name:q.name.trim(),members:q.members,version:q.version}); });
      if(!ups.length && !GPA.deleted.length){ gpaMsg(false,'ไม่มีการเปลี่ยนแปลงให้บันทึก'); return; }
      b.disabled=true;
      call('adminSaveGuildParties',[{upserts:ups,deletes:GPA.deleted}],function(r){
        b.disabled=false;
        if(r.parties){ GPA.parties=r.parties.map(gpaLoc); if(r.ok||r.conflict) GPA.deleted=[]; gpaRender(); }
        gpaMsg(!!r.ok,r.message);
      });
    }
  });
  document.getElementById('adBody').addEventListener('input', function(e){
    if(CUR_TAB!=='gpa') return;
    var t=e.target;
    if(t.dataset.gn!==undefined){ GPA.parties[Number(t.dataset.gn)].name=t.value; var c=t.closest('.gpa-card'); if(c) c.classList.toggle('dirty', gpaIsDirty(GPA.parties[Number(t.dataset.gn)])); }

      var q=t.value.trim().toLowerCase(), p=GPA.parties[Number(t.dataset.gi)];
      var hit=gpaFree().filter(function(m){ return m.name.toLowerCase()===q; })[0];
      if(hit && p.members.length<5){ p.members.push(hit.name); gpaRender(); var n=document.querySelector('[data-gi="'+t.dataset.gi+'"]'); if(n) n.focus(); }
    }
  });
  window.addEventListener('beforeunload', function(e){ if(CUR_TAB==='gpa' && (GPA.deleted.length || GPA.parties.some(gpaIsDirty))){ e.preventDefault(); e.returnValue=''; } });

      content().innerHTML =
        '<div class="dg">'
        + tile('mem','',r.members,'สมาชิกที่ใช้งาน','ยืนยันตัวตนแล้ว '+r.confirmed+' · ยังไม่ยืนยัน '+r.unconfirmed)
        + tile('mem',pend?'warn':'ok',pend,'รออนุมัติ','สมัคร/ยืนยัน '+r.pending.apps+' · เปลี่ยนชื่อ/อาชีพ '+r.pending.changes+(r.pending.admins?' · ผู้ดูแล '+r.pending.admins:''))
        + tile('lv',r.leaveToday?'warn':'','' +r.leaveToday,'ลาวันนี้','ลาใน 7 วันข้างหน้า '+r.leaveWeek+' รายการ')
        + tile('st',att.rate!=null&&att.rate<70?'red':'ok',rate,'อัตราเข้าร่วม 30 วัน','มา '+att.came+' · ขาด '+att.absent+' · ลา '+att.leave)
        + tile('ann','',r.announcements,'ประกาศที่แสดงอยู่','กดเพื่อจัดการประกาศ')
        + '</div>'
        + '<div class="dcols">'
        + '<div class="ad-card"><h3>🎓 สมาชิกแยกตามคลาส</h3>'+bars+'</div>'
        + '<div class="ad-card"><h3>🗓️ กระดานกิจกรรมที่กำลังจะมาถึง</h3>'+bds+'</div>'

        + '<div class="ad-card"><h3>🚫 ขาดกิจกรรมมากสุด (30 วัน)</h3>'+top+'</div>'
        + '</div>';
    });
  }
  document.getElementById('adBody').addEventListener('click', function(e){
    var g=e.target.closest('[data-go]'); if(!g || CUR_TAB!=='dash') return;
    switchTab(g.dataset.go);

  function loadStat(){
    call('adminAttendanceSummary',[STAT.win],function(r){

  /* ===== ซิงก์รายชื่อจาก Excel: วางรายชื่อล่าสุด -> ดูตัวอย่าง -> คัดคนที่ไม่อยู่ในรายชื่อออกให้ทีเดียว ===== */
  var SYNC = {items:[]};
  function syncCardHtml(){
    return '<details class="ad-card"><summary><b>📊 ซิงก์รายชื่อจาก Excel (คัดคนออกทีเดียว)</b></summary><div style="margin-top:12px">'
      +'<p class="gp-desc">เปิดไฟล์ Excel ของกิลด์ ลากคลุม <b>คอลัมน์ชื่อตัวละคร</b> (จะลากคอลัมน์อาชีพติดมาด้วยก็ได้) กดคัดลอก แล้ววางในช่องนี้ · ระบบจะเทียบกับรายชื่อในระบบ คนที่ไม่อยู่ในไฟล์จะถูกเสนอให้ออกจากกิลด์ <b>โดยยังไม่ทำอะไรจนกว่าจะกดยืนยัน</b> และประวัติเข้ากิจกรรมของคนที่ออกยังอยู่ครบ</p>'
      +'<div class="field"><label for="syncTxt">วางรายชื่อล่าสุดจาก Excel (1 คนต่อ 1 บรรทัด)</label><textarea id="syncTxt" rows="7" placeholder="Luna&#9;Priest"></textarea></div>'
      +'<div class="btnrow"><button type="button" class="btn sm" data-a="mem-sync-prev">ตรวจสอบ / ดูตัวอย่าง</button></div>'
      +'<div id="syncOut"></div></div></details>';
  }
  function syncParse(text){
    var out=[], seen={};
    text.split(String.fromCharCode(10)).forEach(function(line){
      line=line.replace(String.fromCharCode(13),'');
      var cells=line.split(String.fromCharCode(9)), c=cells[0].trim().replace(/^"|"$/g,'');
      if(cells.length===1){ var k=line.indexOf(','); if(k>0){ c=line.slice(0,k).trim(); cells=[c,line.slice(k+1)]; } }
      if(!c || seen[c.toLowerCase()]) return; seen[c.toLowerCase()]=1;
      out.push({name:c, job:(cells[1]||'').trim().replace(/^"|"$/g,'')});
    });
    return out;
  }
  function syncList(title,cls,arr,withBox,fmt){
    if(!arr.length) return '';
    return '<div class="ad-card" style="margin:10px 0 0;padding:12px"><b>'+title+' ('+arr.length+')</b><div style="max-height:260px;overflow:auto;margin-top:8px">'
      +arr.map(function(x){ return '<label class="row" style="display:flex;gap:8px;align-items:center;padding:4px 0;cursor:pointer">'+(withBox?'<input type="checkbox" checked data-sk="'+esc(x.name)+'">':'')+'<span>'+esc(x.name)+(x.job?' <small>('+esc(x.job)+')</small>':'')+(fmt?fmt(x):'')+'</span></label>'; }).join('')
      +'</div></div>';
  }
  function syncPreview(){
    var items=syncParse(document.getElementById('syncTxt').value);
    if(items.length<5){ notice(false,'พบรายชื่อเพียง '+items.length+' คน กรุณาวางรายชื่อให้ครบ'); return; }
    SYNC.items=items;
    call('adminSyncMembers',[items,false,{}],function(r){
      var o=document.getElementById('syncOut');
      if(!r.ok){ o.innerHTML='<div class="msg bad">'+esc(r.message)+'</div>'; return; }
      SYNC.res=r;
      o.innerHTML='<div class="meta" style="margin:10px 0">ในไฟล์ '+r.listCount+' คน · ในระบบตอนนี้ '+r.active+' คน · อยู่ต่อ '+r.keep+' คน</div>'
        +syncList('🚪 จะถูกคัดออกจากกิลด์ (เอาติ๊กออกถ้าต้องการให้คนนั้นอยู่ต่อ)','',r.remove,true)
        +syncList('➕ ชื่อใหม่ที่ยังไม่มีในระบบ','',r.add,false,function(x){ return x.similar?' <b style="color:#c0392b">⚠ คล้ายกับ "'+esc(x.similar)+'" (ที่จะถูกคัดออก) ตรวจว่าพิมพ์ชื่อไม่ตรงกันหรือเปล่า</b>':''; })
        +syncList('↩️ กลับเข้ากิลด์ (เคยออกไปแล้ว แต่อยู่ในไฟล์)','',r.reactivate,false)
        +(r.remove.length||r.add.length||r.reactivate.length
          ? '<div class="field" style="margin-top:10px"><label><input type="checkbox" id="syncAdd" checked> เพิ่มชื่อใหม่ '+r.add.length+' คนเข้าระบบด้วย</label></div>'
            +'<div class="field" id="syncCfWrap" style="display:'+(r.active>=10&&r.remove.length*2>r.active?'':'none')+'"><label for="syncCf">คัดออกเกินครึ่ง พิมพ์คำว่า ยืนยัน</label><input id="syncCf" autocomplete="off"></div>'
            +'<div class="btnrow"><button type="button" class="btn sm" data-a="mem-sync-do">ดำเนินการตามนี้</button></div>'
          : '<div class="msg ok">รายชื่อในระบบตรงกับไฟล์แล้ว ไม่มีอะไรต้องแก้</div>');
    });
  }
  function syncApply(b){
    var keep=[]; Array.prototype.forEach.call(document.querySelectorAll('#syncOut input[data-sk]'), function(x){ if(!x.checked) keep.push(x.getAttribute('data-sk')); });
    var cf=document.getElementById('syncCf'), add=document.getElementById('syncAdd');
    var nRemove=SYNC.res.remove.length-keep.length;
    twoStep(b,function(){
      call('adminSyncMembers',[SYNC.items,true,{keep:keep,addNew:!!(add&&add.checked),confirm:cf?cf.value.trim():''}],function(r){
        if(r.needConfirm){ var w=document.getElementById('syncCfWrap'); if(w) w.style.display=''; b.disabled=false; delete b.dataset.armed; b.textContent=b.dataset.label||'ดำเนินการตามนี้'; notice(false,r.message); return; }
        SYNC.items=[]; memAfter(r);
      });
    });
  }

  function parseBulk(text){
    var out=[], lines=text.split(String.fromCharCode(10));
    lines.forEach(function(line){
      line=line.trim(); if(!line) return;
      var c=line.indexOf(','), t=line.indexOf(String.fromCharCode(9));
      var i = (c===-1)?t:((t===-1)?c:Math.min(c,t));
      out.push(i===-1 ? {name:line,job:''} : {name:line.slice(0,i).trim(), job:line.slice(i+1).trim()});
    });
    return out;
  }

  /* ตัวจัดการคลิกของแท็บสมาชิกกิลด์ */
  document.getElementById('adBody').addEventListener('click', function(e){
    var b = e.target.closest('button[data-a]'); if(!b) return;
    var a = b.dataset.a;
    if(a.indexOf('mem-')!==0 && a.indexOf('cls-')!==0) return;
    if(a==='mem-leave'){
      twoStep(b,function(){ call('adminSetMemberStatus',[b.dataset.name,'ออกจากกิลด์'],memAfter); });
    } else if(a==='mem-dc-all'){
      var names=[], want=b.dataset.v==='1';
      Array.prototype.forEach.call(document.querySelectorAll('#adContent .row[data-dc]'), function(r){
        if(r.style.display==='none') return;
        var cb=r.querySelector('input[data-dc]'); if(cb) names.push(cb.getAttribute('data-dc'));
      });
      if(!names.length){ notice(false,'ไม่มีรายชื่อที่แสดงอยู่'); return; }
      call('adminSetDiscord',[names,want],function(r){ if(r.ok){ var set={}; names.forEach(function(n){ set[n]=true; }); MEM.forEach(function(m){ if(set[m.name]) m.discord=want; }); } memAfter(r); });
    } else if(a==='mem-sync-prev'){ syncPreview();
    } else if(a==='mem-sync-do'){ syncApply(b);
    } else if(a==='cls-save'){
      call('adminSaveClass',[document.getElementById('clsName').value,document.getElementById('clsColor').value,document.getElementById('clsIcon').value],memAfter);
    } else if(a==='cls-edit'){
      document.getElementById('clsName').value=b.dataset.name; document.getElementById('clsColor').value=b.dataset.color;
      document.getElementById('clsIcon').value=b.dataset.icon; document.getElementById('clsName').focus();
    } else if(a==='cls-del'){
      twoStep(b,function(){ call('adminDeleteClass',[b.dataset.name],memAfter); });
    } else if(a==='mem-pinclear'){
      call('adminClearAllPins',[document.getElementById('pinClrTxt').value],function(r){ MEMPIN=[]; memAfter(r); });
    } else if(a==='mem-app-all'){
      twoStep(b,function(){ call('adminApproveAllClaims',[],memAfter); });
    } else if(a==='mem-app-ok'){
      twoStep(b,function(){ call('adminDecideApplication',[b.dataset.id,true],memAfter); });
    } else if(a==='mem-app-no'){
      call('adminDecideApplication',[b.dataset.id,false],memAfter);
    } else if(a==='mem-chg-ok'){
      twoStep(b,function(){ call('adminDecideChange',[b.dataset.id,true],memAfter); });
    } else if(a==='mem-chg-no'){
      call('adminDecideChange',[b.dataset.id,false],memAfter);
    } else if(a==='mem-pinall'){
      twoStep(b,function(){
        call('adminSetMissingPins',[],function(r){ MEMPIN=r.list||[]; memAfter(r); });
      });
    } else if(a==='mem-pinhide'){ MEMPIN=[]; renderMem();
    } else if(a==='mem-pincopy'){
      var ta=document.getElementById('pinOut'), pm=document.getElementById('pinMsg');
      function ok(){ pm.className='msg ok'; pm.textContent='คัดลอกแล้ว'; }
      function fb(){ try{ ta.focus(); ta.select(); if(document.execCommand('copy')) ok(); else { pm.className='msg bad'; pm.textContent='คัดลอกอัตโนมัติไม่ได้ ให้ลากเลือกข้อความแล้วคัดลอกเอง'; } }catch(e){ pm.className='msg bad'; pm.textContent='คัดลอกอัตโนมัติไม่ได้ ให้ลากเลือกข้อความแล้วคัดลอกเอง'; } }
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(ok, fb); } else fb();
    } else if(a==='mem-pin'){
      if(b.dataset.has) twoStep(b,function(){ call('adminSetMemberPin',[b.dataset.name],memAfter); });
      else call('adminSetMemberPin',[b.dataset.name],memAfter);
    } else if(a==='mem-back'){
      call('adminSetMemberStatus',[b.dataset.name,'ใช้งาน'],memAfter);
    } else if(a==='mem-bulk'){
      var items=parseBulk(document.getElementById('mmBulk').value);
      if(!items.length){ notice(false,'ยังไม่ได้ใส่รายชื่อ'); return; }
      call('adminAddMembers',[items],memAfter);
    }
  });

  /* ---------- กระดิ่งแจ้งเตือน ---------- */
  var BELL = {list:[], seen:0};
  function seenKey(){ return 'sg_seen_'+String(LOGIN?LOGIN.name:ADMIN.name).toLowerCase(); }
  function loadSeen(){ try{ BELL.seen = Number(localStorage.getItem(seenKey()))||0; }catch(e){ BELL.seen=0; } }
  function bellCut(){ return Math.max(BELL.seen, Date.now()-7*86400000); }
  function bellCount(){ var c=bellCut(); return BELL.list.filter(function(x){ return x.at>c; }).length; }
  function paintBell(){
    var n=bellCount(), bd=document.getElementById('tbBadge');
    if(!bd) return;
    bd.style.display = n ? '' : 'none'; bd.textContent = n>9 ? '9+' : String(n);
  }
  function fetchBell(){
    if(!isAuthed()) return;
    google.script.run.withSuccessHandler(function(r){ BELL.list=(r&&r.list)||[]; paintBell(); })
      .getNotifications(LOGIN?LOGIN.name:ADMIN.name);
  }
  var BELL_ICON = {ann:'📢', board:'🗓️', change:'✏️'};
  function fmtAt(ms){ var d=new Date(ms+7*3600000); function z(n){ return n<10?'0'+n:''+n; } return z(d.getUTCDate())+'/'+z(d.getUTCMonth()+1)+' '+z(d.getUTCHours())+':'+z(d.getUTCMinutes()); }
  function buildBell(m){
    var cut=bellCut();
    m.innerHTML = '<div class="bl-h">🔔 การแจ้งเตือน</div>' + (BELL.list.length
      ? BELL.list.map(function(x,i){ return '<div class="bl-it'+(x.at>cut?' new':'')+'" data-i="'+i+'"><span>'+(BELL_ICON[x.type]||'•')+'</span><div>'+esc(x.title)+'<small>'+fmtAt(x.at)+'</small></div></div>'; }).join('')
      : '<div class="empty" style="padding:16px;font-size:14px">ยังไม่มีการแจ้งเตือน</div>');
    var mx=BELL.list.reduce(function(a,x){ return Math.max(a,x.at); },0);
    BELL.seen=Math.max(Date.now(), mx);
    try{ localStorage.setItem(seenKey(), String(BELL.seen)); }catch(e){}
    paintBell();
  }

      '<div class="gm-h">เข้าสู่ SAILOR GUILD</div><div class="gm-b">'
      + '<label class="gm-rem"><input type="checkbox" id="gmRem" checked> จำไอดี</label>'
      + '<div class="gm-lab">ไอดี</div><input id="gmId" maxlength="50" autocomplete="username" value="'+esc(rid)+'" placeholder="ชื่อตัวละคร">'
      + '<div class="gm-lab">PIN</div><input id="gmPin" type="password" maxlength="100" autocomplete="current-password" placeholder="PIN">'
      + '<div class="gm-div"></div><div class="gm-q">ต้องการเข้าสู่ SAILOR หรือไม่ ?</div>'
      + '<button type="button" class="gm-btn" id="gmOk">ตกลง</button>'
      + '<div class="gm-hint" style="text-align:center;margin:0 0 8px">สมาชิกเดิมเข้าครั้งแรก: กด "สมัครสมาชิก" เพื่อตั้ง PIN และยืนยันตัวตนก่อน</div>'
      + '<div class="gm-two"><button type="button" class="gm-btn sm" id="gmReg">สมัครสมาชิก</button><button type="button" class="gm-btn sm" id="gmCancel">ยกเลิก</button></div>'
      + '<div class="msg" id="gmMsg" role="status"></div>'
      + '<button type="button" class="gm-link" id="gmForgot">ลืมรหัสผ่าน?</button>'
      + '<button type="button" class="gm-link" id="gmStaff" style="margin-top:6px;font-size:13px;opacity:.85">สำหรับทีมงาน: ลงทะเบียนผู้ดูแลระบบ</button></div>';
    var msg=document.getElementById('gmMsg');
    function bad(t){ msg.className='msg bad'; msg.textContent=t; }
    function go(){
      var id=document.getElementById('gmId').value.trim(), pw=document.getElementById('gmPin').value;
      msg.className='msg'; msg.textContent='';
      if(!id) return bad('กรุณากรอกไอดี (ชื่อตัวละคร)');
      if(!pw) return bad('กรุณากรอก PIN');
      try{ if(document.getElementById('gmRem').checked) localStorage.setItem('sg_rid',id); else localStorage.removeItem('sg_rid'); }catch(e){}
      var b=document.getElementById('gmOk'); b.disabled=true; b.textContent='กำลังตรวจสอบ...';
      function done(){ b.disabled=false; b.textContent='ตกลง'; }
      google.script.run.withSuccessHandler(function(r){
        done();
        if(!r||!r.ok){ bad(r&&r.message?r.message:'เกิดข้อผิดพลาด'); return; }
        if(r.kind==='admin'){ ADMIN.name=r.name; ADMIN.role=r.role; tokSet(r.token); setLogin({name:r.memberName||r.name,job:r.job||'',member:!!r.member,admin:true}); closeGm(); }
        else { setTok(r.token); setLogin({name:r.name,job:r.job,member:true,staff:!!r.staff}); closeGm(); }
      }).withFailureHandler(function(err){ done(); bad('เข้าสู่ระบบไม่สำเร็จ: '+(err&&err.message?err.message:err)); })
        .portalLogin(id,pw);
    }
    document.getElementById('gmOk').addEventListener('click', go);
    document.getElementById('gmPin').addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });
    document.getElementById('gmId').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('gmPin').focus(); });
    document.getElementById('gmReg').addEventListener('click', gmRegister);
    document.getElementById('gmCancel').addEventListener('click', closeGm);
    document.getElementById('gmForgot').addEventListener('click', function(){ msg.className='msg ok'; msg.textContent='ลืม PIN? กรุณาติดต่อทีมงานเพื่อขอรีเซ็ต PIN (ช่องทางติดต่ออยู่ด้านล่างของหน้าหลัก)'; });
    document.getElementById('gmStaff').addEventListener('click', function(){ closeGm(); openAuth('register'); });
    setTimeout(function(){ var f=document.getElementById(rid?'gmPin':'gmId'); if(f) f.focus(); },50);
  }
  function gmRegister(){
    var opts='<option value="">-- เลือกคลาส --</option>'+allJobNames().map(function(n){ return '<option value="'+esc(n)+'">'+esc(n)+'</option>'; }).join('');
    gm().innerHTML =
      '<div class="gm-h">สมัครสมาชิก / ยืนยันตัวตน</div><div class="gm-b">'
      + '<div class="gm-hint" style="margin:0 0 6px;font-size:13.5px;color:#ffe9a8">สมาชิกเดิมของกิลด์: กรอกชื่อในเกมส์ให้ตรงกับรายชื่อกิลด์ แล้วตั้ง PIN เพื่อยืนยันตัวตนก่อนเข้าใช้งานครั้งแรก (รอทีมงานอนุมัติ)</div>'
      + '<div class="gm-lab l">ชื่อในเกมส์ <span style="color:#ff8a8a">*</span></div><input id="grName" maxlength="50" autocomplete="off">'
      + '<div class="gm-lab l">คลาส <span style="color:#ff8a8a">*</span></div><select id="grJob">'+opts+'</select>'
      + '<div class="gm-lab l">คู่หู/ทีมที่อยากอยู่ด้วย <small style="font-weight:400;color:rgba(255,255,255,.6)">(ไม่บังคับ)</small></div><input id="grPartner" maxlength="100" autocomplete="off">'
      + '<div class="gm-lab l">ตั้งรหัส PIN <span style="color:#ff8a8a">*</span></div><input id="grPin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">'
      + '<div class="gm-hint">ตรงนี้จะตั้งตัวเลข 4–6 หลัก ต้องใช้ตอนแก้โปรไฟล์ครั้งต่อไป</div>'
      + '<div class="gm-lab l">ยืนยันรหัส PIN <span style="color:#ff8a8a">*</span></div><input id="grPin2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">'
      + '<div class="gm-div"></div><div class="gm-q">คำขอจะส่งให้ทีมงานตรวจสอบและอนุมัติ</div>'
      + '<button type="button" class="gm-btn" id="grGo">ส่งคำขอสมัคร</button>'
      + '<div class="gm-two"><button type="button" class="gm-btn sm" id="grBack">กลับ</button><button type="button" class="gm-btn sm" id="grCancel">ยกเลิก</button></div>'
      + '<div class="msg" id="grMsg" role="status"></div></div>';
    var msg=document.getElementById('grMsg');
    function bad(t){ msg.className='msg bad'; msg.textContent=t; }
    document.getElementById('grBack').addEventListener('click', gmLogin);
    document.getElementById('grCancel').addEventListener('click', closeGm);
    document.getElementById('grGo').addEventListener('click', function(){
      var n=document.getElementById('grName').value.trim(), j=document.getElementById('grJob').value, pt=document.getElementById('grPartner').value.trim(),
          p=document.getElementById('grPin').value.trim(), p2=document.getElementById('grPin2').value.trim();
      msg.className='msg';
      if(!n) return bad('กรุณากรอกชื่อในเกมส์');
      if(!j) return bad('กรุณาเลือกคลาส');
      if(!/^[0-9]{4,6}$/.test(p)) return bad('PIN ต้องเป็นตัวเลข 4-6 หลัก');
      if(p!==p2) return bad('PIN ทั้งสองช่องไม่ตรงกัน');
      var b=this; b.disabled=true;
      google.script.run.withSuccessHandler(function(r){
        b.disabled=false; msg.className='msg '+(r&&r.ok?'ok':'bad'); msg.textContent=r?r.message:'เกิดข้อผิดพลาด';
        if(r&&r.ok){ b.style.display='none'; ['grName','grPartner','grPin','grPin2'].forEach(function(id){ document.getElementById(id).value=''; }); }
      }).withFailureHandler(function(err){ b.disabled=false; bad('ส่งข้อมูลไม่สำเร็จ: '+(err&&err.message?err.message:err)); })
        .memberApply(n,j,p,pt);
    });
  }
  function gmOut(){
    gm().innerHTML =
      '<div class="gm-h">SAILOR GUILD</div><div class="gm-b"><div class="gm-who">สวัสดี <b>'+esc(LOGIN.name)+'</b>'+(LOGIN.job?' <small style="opacity:.7">('+esc(LOGIN.job)+')</small>':'')+'</div>'
      + '<div class="gm-div"></div><div class="gm-q">ต้องการออกจากระบบหรือไม่ ?</div>'
      + '<div class="gm-two"><button type="button" class="gm-btn sm" id="goOut">ออกจากระบบ</button><button type="button" class="gm-btn sm" id="goClose">ปิด</button></div></div>';
    document.getElementById('goOut').addEventListener('click', function(){ setLogin(null); closeGm(); });
    document.getElementById('goClose').addEventListener('click', closeGm);
  }
  function showMenu(){
    document.body.classList.remove('welcome');
    document.getElementById('welcomeBox').style.display='none';
    document.getElementById('menuBox').style.display='flex';
    try{ sessionStorage.setItem('sg_in','1'); }catch(e){}
  }
  document.getElementById('wEnter').addEventListener('click', showMenu);
  document.getElementById('gmOv').addEventListener('mousedown', function(e){ if(e.target===this) closeGm(); });
  document.getElementById('tbDiscord').addEventListener('click', function(){
    if(STATE.discord) window.open(STATE.discord,'_blank','noopener'); else alert('ยังไม่ได้ตั้งค่าลิงก์ Discord (ตั้งที่ชีต Config > DISCORD_URL)');
  });
  document.getElementById('tbLang').addEventListener('click', function(e){ e.stopPropagation(); toggleMenu('tbLangMenu'); });
  document.addEventListener('click', closeMenus);
  document.getElementById('tbBell').addEventListener('click', function(e){ e.stopPropagation(); fetchBell(); toggleMenu('bellMenu', buildBell); });
  document.getElementById('bellMenu').addEventListener('click', function(e){
    e.stopPropagation();
    var it=e.target.closest('.bl-it'); if(!it) return;
    var x=BELL.list[Number(it.dataset.i)]; closeMenus(); if(!x) return;
    if(x.type==='ann') handle(MENU.filter(function(m){ return m.id==='announce'; })[0]);
    else if(x.type==='board') openEventsPanel();
    else if(x.type==='change') openChangePanel();
  });
  document.getElementById('acMenu').addEventListener('click', function(e){
    e.stopPropagation();
    var b=e.target.closest('[data-ac]'); if(!b) return;
    var a=b.dataset.ac; closeMenus();
    if(a==='admin'){ if(ADMIN.token) openAdminView(); else { openAuth('login'); var an=document.getElementById('auName'); if(an){ an.value=(LOGIN?LOGIN.name:''); var ap=document.getElementById('auPw'); if(ap) ap.focus(); } } } else if(a==='pin') openPinPanel(); else if(a==='out') doLogout();
  });
  document.getElementById('tbLangMenu').addEventListener('click', function(e){ e.stopPropagation(); });
  setInterval(fetchBell, 300000);
  document.body.classList.add('welcome');
  try{ if(sessionStorage.getItem('sg_in')==='1') showMenu(); }catch(e){}
  function init(){
    buildMenu();
    try{ var sv=JSON.parse(sessionStorage.getItem('sg_login')||'null'); if(sv&&sv.name) LOGIN=sv; }catch(e){}
    paintLogin();
    google.script.run.withSuccessHandler(function(d){
      STATE.discord = d.discord;
      setCustomClasses(d.classes);
      if(d.activities && d.activities.length) STATE.activities = d.activities;
      // ใช้รูปจากชีต Config ทับรูปที่ฝังไว้ เฉพาะเมื่อโหลดรูปได้จริง
      if(d.logo){ var li=new Image(); li.onload=function(){ var el=document.getElementById('logo'); el.src=d.logo; el.style.display='block'; document.getElementById('logoFallback').style.display='none'; }; li.src=d.logo; }
      if(d.bg){ var bi=new Image(); bi.onload=function(){ document.body.style.backgroundImage="url('"+d.bg+"')"; }; bi.src=d.bg; }
      if(d.serverName){ document.getElementById('serverName').textContent = d.serverName; }
    }).getInitData();
  }
  window.onAuthRequired=function(msg){
    if(ADMIN.token){ tokSet(''); ADMIN.name=''; ADMIN.role=''; try{ closeAdminView(); }catch(e){} }
    setLogin(null); closePanel && closePanel();
    openGm('login'); var m=document.getElementById('gmMsg'); if(m){ m.className='msg bad'; m.textContent=msg||'หมดเวลาเข้าสู่ระบบ กรุณาเข้าสู่ระบบใหม่'; }
  };
  init();
  // ติดตั้งเป็นแอปแล้วเปิดใหม่: คืนสถานะล็อกอินจากโทเคนสมาชิกที่ยังไม่หมดอายุ
  (function(){
    var t=''; try{ t=localStorage.getItem('sg_tok')||''; }catch(e){}
    if(LOGIN || !t) return;
    google.script.run.withSuccessHandler(function(r){
      if(r && r.ok){ setLogin({name:r.name,job:r.job,member:true,staff:!!r.staff}); showMenu(); }
      else setTok('');
    }).sessionCheck();
  })();
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
</script>
</body>
</html>
