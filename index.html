  /* ชั้นฟิลเตอร์สีฟ้าอ่อนบางๆ ให้อ่านง่าย */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;
    background:linear-gradient(180deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,.18) 100%);
  }
  .wrap{position:relative;z-index:1;max-width:1500px;margin:0 auto;padding:24px 16px 48px;
        display:flex;flex-direction:column;align-items:center}

  .logo{width:min(300px,62vw);height:auto;filter:drop-shadow(0 8px 14px rgba(20,49,107,.4));
        animation:float 4s ease-in-out infinite}
  .logo-fallback{display:none;font-weight:700;font-size:44px;color:var(--navy);
        text-shadow:0 2px 0 #fff,0 6px 14px rgba(20,49,107,.4)}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  .wbox{width:min(480px,100%);display:flex;flex-direction:column;gap:16px;margin-top:18px}
  body.welcome .wrap{min-height:100vh;justify-content:center;padding-top:30px}
  .wcard{background:linear-gradient(180deg,#2c4a86 0%,#1f3a70 55%,#1a3262 100%);border-radius:28px;box-shadow:0 16px 38px rgba(10,25,70,.45);
    padding:26px 22px 30px;text-align:center;border:1px solid rgba(255,255,255,.12)}
  .wcard .wcap{font-size:clamp(16px,4.4vw,19px);color:#c9d7f5;margin-bottom:6px}
  .wcard .wt1{font-size:clamp(36px,10.5vw,52px);font-weight:800;color:#fff;line-height:1.1;letter-spacing:1px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
  .wcard .wt2{display:inline-block;margin-top:16px;font-size:clamp(20px,5.6vw,26px);font-weight:700;color:#1a2a55;line-height:1.2;
    padding:6px 26px;border-radius:999px;background:#e9b949;box-shadow:0 4px 12px rgba(0,0,0,.25)}
  .wgo{align-self:center;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:inherit;font-size:20px;font-weight:600;color:#fff;
    border:0;border-radius:999px;padding:14px 38px;background:linear-gradient(90deg,#1d6be0,#2aa0ff);box-shadow:0 10px 24px rgba(29,107,224,.45);
    transition:transform .15s}
  .wgo:hover{transform:translateY(-2px)}
  #menuBox{width:100%;display:flex;flex-direction:column;align-items:center}
  .lgcard,.ctcard{width:min(1080px,100%);background:rgba(255,255,255,.95);border:2px solid var(--sky-2);border-bottom:5px solid var(--navy-2);
    border-radius:20px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:22px}
  .lgcard.flash{animation:flash .9s}
  @keyframes flash{0%,100%{box-shadow:var(--shadow)}30%{box-shadow:0 0 0 5px rgba(245,184,0,.8),var(--shadow)}}
  .lg-t{font-weight:600;font-size:17px;margin-bottom:10px;text-align:center}
  .lg-row{display:flex;gap:8px;flex-wrap:wrap}
  .lg-row input{flex:1 1 150px;min-width:0;padding:11px 12px;font-size:16px;font-family:inherit;color:var(--navy);border:2px solid var(--sky-2);border-radius:12px;outline:none}
  .lg-row input:focus{border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(29,74,160,.18)}
  .lg-row .btn{flex:0 0 auto;width:auto;padding:11px 22px}
  .lg-links{text-align:center;margin-top:10px;font-size:14px}
  .linkbtn{background:none;border:0;color:#1f5bd6;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline}
  .lg-in{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .lg-in .btn{width:auto;padding:8px 18px;font-size:15px}
  .ctcard{margin:26px 0 0;display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
  .ctcard img{width:150px;height:150px;border-radius:12px;border:2px solid var(--sky-2);background:#fff}
  .ctcard .ct-t{font-size:18px;font-weight:700;color:var(--navy)}
  .ctcard .ct-s{font-size:14px;color:#5b74a8;margin-top:4px}
  .ctcard .btn{width:auto;padding:9px 18px;font-size:15px;margin-top:10px}
  .headline{
    margin:10px 0 22px;padding:10px 28px;border-radius:999px;
    background:rgba(255,255,255,.85);backdrop-filter:blur(6px);
    border:2px solid var(--navy-2);box-shadow:var(--shadow);
    font-size:clamp(20px,4.5vw,30px);font-weight:600;color:var(--navy);text-align:center
  }

  .grid{
    width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:16px;
    max-width:1080px;margin:0 auto;gap:20px;
  }
  .grid .card{flex:0 0 250px}
  @media (max-width:640px){
    .grid{gap:12px}
    .grid .card{flex:0 0 calc(50% - 6px);padding:20px 8px 16px}
    .icon{width:74px;height:74px}.icon svg{width:40px;height:40px}
    .label{font-size:16px}
  }
  .card{
    appearance:none;cursor:pointer;text-align:center;
    background:linear-gradient(160deg,#2f6fe0 0%,#1d4aa0 50%,#14316b 100%);
    border:2px solid #8cc4ff;border-radius:22px;
    padding:26px 12px 22px;box-shadow:var(--shadow);
    font-family:inherit;color:#fff;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
    text-decoration:none;
  }
  .card:hover,.card:focus-visible{
    transform:translateY(-6px);outline:none;
    background:linear-gradient(160deg,#4a8cf0 0%,#2559c0 50%,#17387a 100%);border-color:#d4ebff;
    box-shadow:0 18px 34px rgba(20,49,107,.45);
  }
  .card:active{transform:translateY(-1px)}
  .icon{
    width:92px;height:92px;border-radius:50%;
    background:linear-gradient(145deg,#ffffff,#cfe8ff);
    display:grid;place-items:center;border:4px solid #9fd0ff;
    box-shadow:0 4px 10px rgba(5,20,60,.35),inset 0 2px 6px rgba(255,255,255,.8);
  }
  .icon svg{width:50px;height:50px;stroke:#14316b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .label{font-size:18px;font-weight:600;line-height:1.3;text-shadow:0 1px 3px rgba(5,20,60,.5)}

  .footer{margin-top:22px;color:var(--navy);font-size:13px;text-shadow:0 1px 3px rgba(255,255,255,.9);text-align:center}

  /* ---------- Panel (หน้าย่อย) ---------- */
  .overlay{position:fixed;inset:0;z-index:10;background:rgba(20,49,107,.55);
           display:none;align-items:center;justify-content:center;padding:16px}
  .overlay.show{display:flex}
  .panel{
    width:min(1000px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;
    border:3px solid var(--navy-2);box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .panel-head{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:14px 18px;background:linear-gradient(90deg,var(--navy),var(--navy-2));color:#fff}
  .panel-head h2{font-size:20px;font-weight:600}
  .close{background:#fff;color:var(--navy);border:0;width:34px;height:34px;border-radius:50%;
         font-size:20px;cursor:pointer;font-family:inherit}
  .panel-body{padding:18px}
  .empty{text-align:center;padding:30px 10px;color:#5b74a8}
  .ann{border:1px solid var(--sky-2);background:var(--sky);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .ann h3{font-size:17px;margin-bottom:2px}
  .ann small{color:#5b74a8}
  .ann p{margin-top:6px;white-space:pre-wrap}
  .pin{display:inline-block;background:var(--gold);color:#fff;border-radius:8px;padding:0 8px;font-size:12px;margin-left:6px}
  .loading{text-align:center;padding:24px;color:var(--navy-2)}

  var JOBIDX = {};
  function jobKey(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9\u0e00-\u0e7f]/g,''); }
  function jobDark(c){
    var r=parseInt(c.substr(1,2),16), g=parseInt(c.substr(3,2),16), b=parseInt(c.substr(5,2),16);
    function lum(){ return (0.299*r+0.587*g+0.114*b)/255; }
    var n=0; while(lum()>0.36 && n++<30){ r=Math.round(r*0.92); g=Math.round(g*0.92); b=Math.round(b*0.92); }
    return 'rgb('+r+','+g+','+b+')';
  }
  JOBS.forEach(function(j){ j.d=jobDark(j.c); JOBIDX[jobKey(j.n)]=j; });
  var CUSTOM = [];
  function setCustomClasses(list){
    CUSTOM.forEach(function(j){ if(JOBIDX[jobKey(j.n)]===j) delete JOBIDX[jobKey(j.n)]; });
    CUSTOM = [];
    (list||[]).forEach(function(x){
      if(!x || !x.name || !/^#[0-9a-fA-F]{6}$/.test(x.color||'') || JOBIDX[jobKey(x.name)]) return;
      var ic = /^https:\/\//i.test(x.icon||'') ? x.icon : '';
      var j = {n:x.name, c:x.color, d:jobDark(x.color), i:ic, custom:true};
      CUSTOM.push(j); JOBIDX[jobKey(j.n)] = j;
    });
  }
  function allJobNames(){ return JOBS.map(function(j){ return j.n; }).concat(CUSTOM.map(function(j){ return j.n; })); }
  var JOBALIAS = {'อาลิเทีย':'Alithea'};
  Object.keys(JOBALIAS).forEach(function(k){ JOBIDX[jobKey(k)] = JOBIDX[jobKey(JOBALIAS[k])]; });
  function jobInfo(job){ return JOBIDX[jobKey(job)] || null; }
  function jobStyle(job){ var j=jobInfo(job); return j ? ' style="--jc:'+j.c+';--jd:'+j.d+'"' : ''; }
  function jobIcon(job){ var j=jobInfo(job); return j && j.i ? '<img class="jic" src="'+esc(j.i)+'" alt="" title="'+esc(job)+'" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">' : ''; }

  function buildMenu(){
    var html = MENU.map(function(m){
      return '<button class="card" data-id="'+m.id+'">'
        + '<div class="icon">'+ICONS[m.icon]+'</div>'
        + '<div class="label">'+m.label+'</div></button>';
    }).join('');
    var el = document.getElementById('menu');
    el.innerHTML = html;
    el.addEventListener('click', function(e){
      var btn = e.target.closest('.card'); if(!btn) return;
      var item = MENU.filter(function(x){return x.id===btn.dataset.id})[0];
      if(!isAuthed()){ openGm('login'); return; }
      handle(item);
    });
  }

  function handle(item){
    if(item.action==='discord'){
      if(STATE.discord) window.open(STATE.discord,'_blank','noopener');
      else openPanel(item.label,'<div class="empty">ยังไม่ได้ตั้งค่าลิงก์ Discord<br>(ตั้งค่าที่ชีต Config > DISCORD_URL)</div>');
    } else if(item.action==='soon'){
      openPanel(item.label,'<div class="empty">🔨 ระบบการประมูล<br>เร็ว ๆ นี้</div>');
    } else if(item.action==='change'){
      openChangePanel();
    } else if(item.action==='stats'){
      openStatsPanel();
    } else if(item.action==='leave'){
      openLeavePanel();
    } else if(item.action==='party'){
      openGuildParties();
    } else if(item.action==='events'){
      openEventsPanel();
    } else if(item.action==='announce'){
      openPanel(item.label,'<div class="loading">กำลังโหลดประกาศ...</div>');
      google.script.run
        .withSuccessHandler(renderAnnouncements)
        .withFailureHandler(function(err){
          document.getElementById('panelBody').innerHTML='<div class="empty">โหลดไม่สำเร็จ: '+esc(err.message||err)+'</div>';
        })
        .getAnnouncements();
    } else {
      openPanel(item.label,'<div class="empty">🚧 หน้านี้กำลังพัฒนา<br>เร็วๆ นี้</div>');
    }
  }

      + '<div class="field" data-f="job"><label for="bkJob">อาชีพ</label>'

      + '<div class="field" data-f="activity"><label for="bkAct">กิจกรรมที่ต้องการให้ช่วยเหลือ</label>'
      +   '<select id="bkAct"><option value="">-- เลือกกิจกรรม --</option>'+opts+'</select><div class="hint">กรุณาเลือกกิจกรรม</div></div>'
      + '<button class="btn" id="bkSubmit" type="submit">ยืนยันจองคิว</button>'
      + '<div class="msg" id="bkMsg" role="status"></div>'
      + '</form>';
  }

  function bindBookingForm(){
    var form = document.getElementById('bkForm');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var v = {
        name: document.getElementById('bkName').value.trim(),
        job: document.getElementById('bkJob').value.trim(),
        gp: document.getElementById('bkGp').value.replace(/,/g,'').trim(),
        activity: document.getElementById('bkAct').value
      };
      var gpNum = Number(v.gp);
      var bad = {
        name: !v.name,
        job: !v.job,
        gp: v.gp==='' || !isFinite(gpNum) || gpNum<0 || Math.floor(gpNum)!==gpNum,
        activity: !v.activity
      };
      var anyBad = false;
      Object.keys(bad).forEach(function(k){
        form.querySelector('[data-f="'+k+'"]').classList.toggle('err', bad[k]);
        if(bad[k]) anyBad = true;
      });
      var msg = document.getElementById('bkMsg');
      msg.className = 'msg';
      if(anyBad) return;

      var btn = document.getElementById('bkSubmit');
      btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
      google.script.run
        .withSuccessHandler(function(r){
          btn.disabled = false; btn.textContent = 'ยืนยันจองคิว';
          msg.className = 'msg ' + (r && r.ok ? 'ok' : 'bad');
          msg.textContent = r ? r.message : 'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง';
          if(r && r.ok) form.reset();
        })
        .withFailureHandler(function(err){
          btn.disabled = false; btn.textContent = 'ยืนยันจองคิว';
          msg.className = 'msg bad';
          msg.textContent = 'ส่งข้อมูลไม่สำเร็จ: ' + (err && err.message ? err.message : err);
        })
        .submitBooking(v);
    });
  }

  function renderAnnouncements(list){
    var body = document.getElementById('panelBody');
    if(!list || !list.length){ body.innerHTML='<div class="empty">ยังไม่มีประกาศ</div>'; return; }
    body.innerHTML = list.map(function(a){

  function openAuth(mode){
    openPanel('🔐 สำหรับ Admin', authFormHtml(mode));

    body.querySelectorAll('.tab').forEach(function(t){ t.addEventListener('click', function(){ openAuth(t.dataset.mode); }); });
    var form = document.getElementById('authForm'), msg = document.getElementById('auMsg'), btn = document.getElementById('auSubmit');
    function show(ok,text){ msg.className='msg '+(ok?'ok':'bad'); msg.textContent=text; }
    function done(){ btn.disabled=false; btn.textContent = mode==='register'?'ลงทะเบียน':'เข้าสู่ระบบ'; }
    form.addEventListener('submit', function(e){
      e.preventDefault(); msg.className='msg';
      var name=document.getElementById('auName').value.trim(), pw=document.getElementById('auPw').value;
      if(!name || !pw){ show(false,'กรุณากรอกข้อมูลให้ครบ'); return; }
      if(mode==='register'){
        var pw2=document.getElementById('auPw2').value;

      btn.disabled=true; btn.textContent='กำลังตรวจสอบ...';
      var fail=function(err){ done(); show(false,'ส่งข้อมูลไม่สำเร็จ: '+(err&&err.message?err.message:err)); };
      if(mode==='register'){
        google.script.run.withSuccessHandler(function(r){ done(); show(r.ok,r.message); if(r.ok) form.reset(); })
          .withFailureHandler(fail).adminRegister(name,pw,document.getElementById('auPw2').value);
      } else {

          ADMIN.name=r.name; ADMIN.role=r.role; tokSet(r.token); setAdminBtn();

        }).withFailureHandler(fail).adminLogin(name,pw);

    });

  // เรียกฟังก์ชันหลังบ้านแบบเดียวกันทุกที่ (จัดการ token หมดอายุ/ error ให้ที่เดียว)
  function call(fn, args, ok){
    var run = google.script.run
      .withSuccessHandler(function(r){
        if(r && r.expired){ adminExpired(); return; }
        ok(r);
      })
      .withFailureHandler(function(err){ errView('ส่งข้อมูลไม่สำเร็จ: '+(err&&err.message?err.message:err)); });
    run[fn].apply(run, [ADMIN.token].concat(args||[]));
  }
  function notice(ok, text){
    var el=document.getElementById('adNotice');
    if(!el){ el=document.createElement('div'); el.id='adNotice'; content().prepend(el); }
    el.className='msg '+(ok?'ok':'bad'); el.textContent=text;
  }
  function badge(s){
    var c = (s==='อนุมัติ'||s==='ช่วยเหลือแล้ว')?'b-ok':((s==='รออนุมัติ'||s==='รอช่วยเหลือ')?'b-wait':((s==='ปฏิเสธ'||s==='ยกเลิก')?'b-no':'b-sus'));
    return '<span class="badge '+c+'">'+esc(s)+'</span>';
  }
  // ปุ่มยืนยันสองจังหวะ (ไม่ใช้ confirm/alert เพราะบางเบราว์เซอร์บล็อกใน iframe)
  function twoStep(b, fn){
    if(!b.dataset.armed){
      b.dataset.armed='1'; b.dataset.label=b.textContent; b.textContent='กดอีกครั้งเพื่อยืนยัน';
      setTimeout(function(){ if(b.dataset.armed){ delete b.dataset.armed; b.textContent=b.dataset.label; } },4000);
      return;
    }
    b.disabled=true; fn();
  }

  function saveAnn(e){

  /* ===== จองคิว ===== */
  function loadBook(){
    call('adminListBookings',[],function(r){
      if(!r.ok){ errView(r.message); return; }
      BK = r; renderBook();
    });
  }
  function renderBook(){
    var all = BK.list, q = FILTER.q.toLowerCase();
    var rows = all.filter(function(b){
      return (!FILTER.act||b.activity===FILTER.act) && (!FILTER.st||b.status===FILTER.st)
        && (!q || b.name.toLowerCase().indexOf(q)!==-1 || b.job.toLowerCase().indexOf(q)!==-1);
    });
    var wait = all.filter(function(b){return b.status==='รอช่วยเหลือ';}).length;
    var sel = function(opts,cur,ph){ return '<option value="">'+ph+'</option>'+opts.map(function(o){return '<option '+(o===cur?'selected':'')+'>'+esc(o)+'</option>';}).join(''); };
    var isSuper = BK.role==='SuperAdmin';
    var items = rows.map(function(b){
      var stOpts = BK.statuses.map(function(s){return '<option '+(s===b.status?'selected':'')+'>'+esc(s)+'</option>';}).join('');
      return '<div class="item" data-id="'+esc(b.id)+'"><div class="top"><div><b>'+esc(b.name)+'</b> · '+esc(b.job)+badge(b.status)
        +'<div class="meta">'+esc(b.activity)+' · GP '+fmt(b.gp)+' · '+esc(b.date)+'</div></div>'
        +(isSuper?'<button class="mini danger" data-a="bk-del" data-id="'+esc(b.id)+'">ลบ</button>':'')+'</div>'
        +'<div class="bk-edit"><select class="bkSt">'+stOpts+'</select><input class="bkNote" maxlength="300" placeholder="หมายเหตุ (เช่น ใครช่วย)" value="'+esc(b.note)+'">'
        +'<button class="mini go" data-a="bk-save" data-id="'+esc(b.id)+'">บันทึก</button></div></div>';
    }).join('');
    content().innerHTML = '<div class="ad-card"><h3>รายการจองคิว</h3>'
      + '<div class="stat"><div><b>'+all.length+'</b>ทั้งหมด</div><div><b>'+wait+'</b>รอช่วยเหลือ</div></div>'
      + '<div class="filters"><select id="fAct">'+sel(BK.activities,FILTER.act,'ทุกกิจกรรม')+'</select>'
      + '<select id="fSt">'+sel(BK.statuses,FILTER.st,'ทุกสถานะ')+'</select>'
      + '<input id="fQ" placeholder="ค้นหาชื่อ/อาชีพ" value="'+esc(FILTER.q)+'"></div>'
      + (items||'<div class="empty" style="padding:12px">ไม่พบรายการ</div>')+'</div>';
    document.getElementById('fAct').addEventListener('change',function(){ FILTER.act=this.value; renderBook(); });
    document.getElementById('fSt').addEventListener('change',function(){ FILTER.st=this.value; renderBook(); });
    var fq=document.getElementById('fQ');
    fq.addEventListener('input',function(){ FILTER.q=this.value; var pos=this.selectionStart; renderBook(); var n=document.getElementById('fQ'); n.focus(); n.setSelectionRange(pos,pos); });
  }

  function renderAdmins(r){
    var isSuper = r.role==='SuperAdmin';
    var pending = r.list.filter(function(x){return x.status==='รออนุมัติ';});
    var others = r.list.filter(function(x){return x.status!=='รออนุมัติ';});
    function rowHtml(x){
      var acts='';
      if(isSuper && x.role!=='SuperAdmin' && x.name.toLowerCase()!==r.me.toLowerCase()){
        if(x.status==='รออนุมัติ') acts='<button class="mini go" data-a="adm-set" data-act="อนุมัติ" data-name="'+esc(x.name)+'">อนุมัติ</button> <button class="mini danger" data-a="adm-set" data-act="ปฏิเสธ" data-name="'+esc(x.name)+'">ปฏิเสธ</button>';
        else if(x.status==='อนุมัติ') acts='<button class="mini danger" data-a="adm-set" data-act="ระงับ" data-name="'+esc(x.name)+'">ระงับ</button>';
        else acts='<button class="mini go" data-a="adm-set" data-act="อนุมัติ" data-name="'+esc(x.name)+'">อนุมัติอีกครั้ง</button>';
      }
      return '<div class="row"><div><b>'+esc(x.name)+'</b>'+badge(x.status)
        +(x.role==='SuperAdmin'?'<span class="badge b-ok">SuperAdmin</span>':'')
        +'<small>สมัครเมื่อ '+esc(x.createdAt)+(x.approvedBy?' · ดำเนินการโดย '+esc(x.approvedBy):'')+'</small></div><div>'+acts+'</div></div>';
    }
    content().innerHTML = '<div class="ad-card"><h3>คำขอรออนุมัติ ('+pending.length+')</h3>'
      + (pending.length? pending.map(rowHtml).join('') : '<div class="empty" style="padding:12px">ไม่มีคำขอรออนุมัติ</div>')
      + (isSuper?'':'<small style="color:#5b74a8">เฉพาะ SuperAdmin เท่านั้นที่อนุมัติได้</small>')+'</div>'
      + '<div class="ad-card"><h3>ผู้ดูแลระบบทั้งหมด</h3>'+(others.length?others.map(rowHtml).join(''):'<div class="empty" style="padding:12px">ยังไม่มี</div>')+'</div>'
      + '<div class="ad-card"><h3>เปลี่ยนรหัสผ่านของฉัน</h3><form id="pwForm" novalidate>'
      +   '<div class="field"><label for="pwOld">รหัสผ่านเดิม</label><input id="pwOld" type="password" maxlength="100" autocomplete="current-password"></div>'
      +   '<div class="field"><label for="pwNew">รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</label><input id="pwNew" type="password" maxlength="100" autocomplete="new-password"></div>'
      +   '<div class="field"><label for="pwNew2">ยืนยันรหัสผ่านใหม่</label><input id="pwNew2" type="password" maxlength="100" autocomplete="new-password"></div>'
      +   '<button class="btn" id="pwBtn" type="submit">บันทึกรหัสผ่านใหม่</button><div class="msg" id="pwMsg" role="status"></div></form></div>';
    document.getElementById('pwForm').addEventListener('submit', changePw);
  }
  function changePw(e){
    e.preventDefault();
    var msg=document.getElementById('pwMsg'), btn=document.getElementById('pwBtn');
    var o=document.getElementById('pwOld').value, n=document.getElementById('pwNew').value, n2=document.getElementById('pwNew2').value;

    if(!o||!n||!n2){ show(false,'กรุณากรอกข้อมูลให้ครบ'); return; }
    if(n.length<8){ show(false,'รหัสผ่านใหม่ต้องยาว 8 ตัวอักษรขึ้นไป'); return; }

    btn.disabled=true; btn.textContent='กำลังบันทึก...';
    google.script.run.withSuccessHandler(function(r){
      btn.disabled=false; btn.textContent='บันทึกรหัสผ่านใหม่';
      if(r.expired){ adminExpired(); return; }
      show(r.ok,r.message); if(r.ok) document.getElementById('pwForm').reset();

      btn.disabled=false; btn.textContent='บันทึกรหัสผ่านใหม่'; show(false,'ไม่สำเร็จ: '+(err.message||err));
    }).adminChangePassword(ADMIN.token,o,n,n2);
  }

    var byDate={}, order=[];
    LM.sessions.forEach(function(s){ if(!byDate[s.date]){ byDate[s.date]=[]; order.push(s.date); } byDate[s.date].push(s); });
    if(!order.length){ document.getElementById('lmDays').innerHTML='<div class="empty" style="padding:10px">ยังไม่มีกิจกรรมในตารางนัดหมาย</div>'; return; }
    document.getElementById('lmDays').innerHTML = order.map(function(d){
      var x=lvParts(d), list=byDate[d];
      var openAdd=list.filter(function(s){ return !s.closed && !lmIsMine(s); });
      var chips=list.map(function(s){
        var mine=lmIsMine(s), cls='lv-sess'+(mine?' mine':'')+(s.closed?' closed':'')+(LM.sel[lmKey(s)]?' on':'');
        var st = s.closed ? (mine?'ลาแล้ว · ปิดรับแล้ว':'ปิดรับแล้ว') : (mine?'ลาแล้ว · ยกเลิกได้ถึง '+s.closeText:'ปิดรับ '+s.closeText);
        var n=lmCount(s);
        return '<button type="button" class="'+cls+'" data-k="'+esc(lmKey(s))+'" '+(s.closed?'disabled':'')+'><b>'+esc(s.activity)+'</b><small>นัดพบ '+esc(s.meet)+'</small><em>'+st+'</em>'+(n?'<small>ลาแล้ว '+n+' คน</small>':'')+'</button>';
      }).join('');
      return '<div class="lv-dayrow"><div class="lv-dayl">'+x.dow+' '+x.day+' '+x.mon+(openAdd.length>1?' <button type="button" class="mini" data-all="'+d+'">ลาทั้งวัน</button>':'')+'</div><div class="lv-sessrow">'+chips+'</div></div>';
    }).join('');
  }
  function lmMsg(ok,t){ var m=document.getElementById('lmMsg'); if(m){ m.className='msg '+(ok?'ok':'bad'); m.textContent=t; } }
  function lmGo(kind){
    var me=lmMe(), pin=document.getElementById('lmPin').value.trim();
    if(!me){ lmMsg(false,'กรุณาเลือกชื่อตัวละครจากรายชื่อสมาชิก'); return; }
    if(!pin){ lmMsg(false,'กรุณาใส่ PIN'); return; }
    var picked=LM.sessions.filter(function(s){ return LM.sel[lmKey(s)] && (kind==='add' ? !lmIsMine(s) : lmIsMine(s)); });
    if(!picked.length){ lmMsg(false, kind==='add' ? 'กรุณาเลือกกิจกรรมที่ต้องการลา (รายการที่ลาแล้วจะไม่ถูกนับซ้ำ)' : 'กรุณาเลือกรายการที่เคยแจ้งลาไว้ที่ต้องการยกเลิก'); return; }
    var btns=document.querySelectorAll('#lmSubmit,#lmCancel'); btns.forEach(function(b){ b.disabled=true; });
    function done(ok,msg){
      btns.forEach(function(b){ b.disabled=false; });
      if(ok){ LM.sel={}; document.getElementById('lmPin').value=''; }
      lmLoadInfo(function(){ paintLeaveDays(); lmMsg(ok,msg); });   // โหลดใหม่ เพื่ออัปเดตสถานะปิดรับ/จำนวนคนลา
    }
    function fail(err){ btns.forEach(function(b){ b.disabled=false; }); lmMsg(false,'ส่งข้อมูลไม่สำเร็จ: '+(err&&err.message?err.message:err)); }
    if(kind==='add'){
      google.script.run.withSuccessHandler(function(r){
        if(r&&r.ok) done(true,r.message); else { btns.forEach(function(b){ b.disabled=false; }); lmMsg(false, r?r.message:'เกิดข้อผิดพลาด'); }
      }).withFailureHandler(fail)
        .memberLeaveSubmit(me,pin,picked.map(function(s){ return {date:s.date,activity:s.activity}; }),document.getElementById('lmReason').value.trim());
      return;
    }
    var i=0;
    (function next(){
      if(i>=picked.length){ done(true,'ยกเลิกการลาแล้ว '+picked.length+' รายการ'); return; }
      google.script.run.withSuccessHandler(function(r){
        if(!r||!r.ok){ btns.forEach(function(b){ b.disabled=false; }); lmMsg(false, r?r.message:'เกิดข้อผิดพลาด'); return; }
        i++; next();
      }).withFailureHandler(fail).memberLeaveCancel(me,pin,picked[i].date,picked[i].activity);
    })();
  }

  /* =====================================================================
     แจ้ง/แก้ไข รายชื่อตี้ประจำ (ปาร์ตี้กิลด์) — ฝั่งสมาชิก
     ===================================================================== */
  var GP = {parties:[], members:[], me:'', deleted:[], pickIdx:-1, pickSlot:-1};

  function gpLocal(p){
    var m=p.members.slice(); while(m.length<5) m.push('');
    return {id:p.id, name:p.name, version:p.version, members:m, isNew:false, orig:gpSig(p.name,m)};
  }
  function gpCompact(m){ return m.filter(function(x){ return x; }); }
  function gpSig(name,m){ return JSON.stringify([String(name||'').trim(), gpCompact(m)]); }
  function gpMe(){
    var q=GP.me.trim().toLowerCase(); if(!q) return '';
    for(var i=0;i<GP.members.length;i++){ if(GP.members[i].name.toLowerCase()===q) return GP.members[i].name; }
    return '';
  }
  function gpJob(n){
    var q=String(n).toLowerCase();
    for(var i=0;i<GP.members.length;i++){ if(GP.members[i].name.toLowerCase()===q) return GP.members[i].job; }
    return '';
  }
  function gpEditable(p, me){
    if(!me) return false;
    if(p.isNew) return true;
    return gpCompact(p.members).some(function(n){ return n.toLowerCase()===me.toLowerCase(); });
  }
  function gpDirty(p){ return p.isNew ? gpCompact(p.members).length>0 : gpSig(p.name,p.members)!==p.orig; }

  function openGuildParties(){
    openPanel('แจ้ง/แก้ไข รายชื่อตี้ประจำ','<div class="loading">กำลังโหลด...</div>');
    document.querySelector('#overlay .panel').classList.add('wide');
    google.script.run.withSuccessHandler(function(r){
      GP.members=r.members||[]; GP.parties=(r.parties||[]).map(gpLocal); GP.deleted=[];
      try{ GP.me=localStorage.getItem('sg_me')||''; }catch(e){ GP.me=''; }
      renderGP();
    }).withFailureHandler(function(err){
      document.getElementById('panelBody').innerHTML='<div class="empty">โหลดไม่สำเร็จ: '+esc(err.message||err)+'</div>';
    }).getGuildParties();
  }

  function renderGP(){
    var dl=GP.members.map(function(m){ return '<option value="'+esc(m.name)+'">'+esc(m.job)+'</option>'; }).join('');
    document.getElementById('panelBody').innerHTML =
      '<div class="gp-title">🔗 ปาร์ตี้กิลด์</div>'
      + '<p class="gp-desc">ผูกคู่หูหรือทีมที่เข้าขากันไว้ล่วงหน้า (คนแรกคือหัวปาร์ตี้ · สูงสุด 5 คนต่อตี้ · 1 คนอยู่ได้ตี้เดียว) แอดมินจะใช้รายชื่อนี้ตอนจัดปาร์ตี้ลงกระดาน</p>'
      + '<div class="field"><label for="gpMe">ชื่อตัวละครของคุณ (แก้ไขได้เฉพาะตี้ที่มีชื่อคุณอยู่)</label>'
      + '<input id="gpMe" list="gpMeList" autocomplete="off" placeholder="พิมพ์ หรือเลือกจากรายชื่อสมาชิก" value="'+esc(GP.me)+'">'
      + '<datalist id="gpMeList">'+dl+'</datalist><div class="hint">ไม่พบชื่อนี้ในรายชื่อสมาชิกกิลด์</div></div>'
      + '<div id="gpCards"></div>'
      + '<div class="gp-save"><button type="button" class="btn" id="gpSave">บันทึก</button><div class="gp-dirty" id="gpDirty"></div><div class="msg" id="gpMsg" role="status"></div></div>';
    document.getElementById('gpMe').addEventListener('input', function(){
      GP.me=this.value; try{ localStorage.setItem('sg_me', GP.me); }catch(e){}
      this.parentNode.classList.toggle('err', GP.me.trim()!=='' && !gpMe());
      paintGP();
    });
    document.getElementById('gpSave').addEventListener('click', saveGP);
    paintGP();
  }

  function paintGP(){
    var me=gpMe(), box=document.getElementById('gpCards'); if(!box) return;
    var html=GP.parties.map(function(p,i){
      var ed=gpEditable(p,me);
      var slots=p.members.map(function(n,s){
        var first=s===0;
        if(n) return '<div class="gp-slot filled'+(first?' first':'')+'" data-gp="slot" data-i="'+i+'" data-s="'+s+'"><span class="gp-nm">'+(first?'★ ':'')+esc(n)+'</span><small>'+esc(gpJob(n))+'</small>'
          +(ed?'<button type="button" class="gp-x" data-gp="rm" data-i="'+i+'" data-s="'+s+'" title="เอาออก">×</button>':'')+'</div>';
        return '<div class="gp-slot'+(first?' first':'')+'" data-gp="slot" data-i="'+i+'" data-s="'+s+'">'+(ed?'<span class="gp-plus">＋</span>':'')+'</div>';
      }).join('');
      return '<div class="gp-card'+(ed?'':' ro')+'"><div class="gp-head">'
        + '<input class="gp-name" data-i="'+i+'" maxlength="30" placeholder="ตั้งชื่อ เช่น คู่ฮีลแทงค์ (Party '+(i+1)+')" value="'+esc(p.name)+'" '+(ed?'':'readonly')+'>'
        + (ed?'<button type="button" class="gp-trash" data-gp="del" data-i="'+i+'" title="ลบตี้นี้">🗑</button>':'<span class="gp-lock" title="แก้ไขได้เฉพาะสมาชิกในตี้นี้">🔒</span>')
        + '</div><div class="gp-slots">'+slots+'</div></div>';
    }).join('');
    box.innerHTML = html
      + '<button type="button" class="gp-new" data-gp="new"'+(me?'':' disabled')+'>＋<br>สร้างปาร์ตี้กิลด์'+(me?'':'<small>เลือกชื่อตัวละครของคุณก่อน</small>')+'</button>';
    paintGPDirty();
  }
  function paintGPDirty(){
    var n=GP.parties.filter(gpDirty).length+GP.deleted.length;
    var el=document.getElementById('gpDirty'); if(el) el.textContent = n ? '● มีการแก้ไขที่ยังไม่ได้บันทึก' : '';
  }

  function usedNames(){
    var o={}; GP.parties.forEach(function(p){ p.members.forEach(function(n){ if(n) o[n.toLowerCase()]=true; }); }); return o;
  }
  function openGPPicker(i,s){
    GP.pickIdx=i; GP.pickSlot=s;
    document.getElementById('gpPickTitle').textContent='เลือกสมาชิกเข้าตี้ (ช่อง '+(s+1)+(s===0?' · หัวปาร์ตี้':'')+')';
    document.getElementById('gpPickBody').innerHTML='<div class="field"><input id="gpPickQ" placeholder="ค้นหาชื่อ/อาชีพ" autocomplete="off"></div><div id="gpPickList" class="pk-list"></div>';
    document.getElementById('gpPick').classList.add('show');
    paintGPPicker('');
    document.getElementById('gpPickQ').addEventListener('input', function(){ paintGPPicker(this.value); });
    document.getElementById('gpPickQ').focus();
  }
  function closeGPPicker(){ document.getElementById('gpPick').classList.remove('show'); }
  function paintGPPicker(q){
    q=q.trim().toLowerCase(); var used=usedNames();
    var rows=GP.members.filter(function(m){
      return !used[m.name.toLowerCase()] && (!q || m.name.toLowerCase().indexOf(q)!==-1 || m.job.toLowerCase().indexOf(q)!==-1);
    }).map(function(m){ return '<button type="button" class="pk" data-gpm="'+esc(m.name)+'"><b>'+jobIcon(m.job)+esc(m.name)+'</b><small>'+esc(m.job)+'</small></button>'; }).join('');
    document.getElementById('gpPickList').innerHTML = rows || '<div class="empty" style="padding:12px">ไม่มีสมาชิกที่ยังไม่มีตี้ประจำ</div>';
  }

  function gpMsg(ok,t){ var m=document.getElementById('gpMsg'); if(m){ m.className='msg '+(ok?'ok':'bad'); m.textContent=t; } }

  function saveGP(){
    var me=gpMe();
    if(!me){ gpMsg(false,'กรุณาเลือกชื่อตัวละครของคุณจากรายชื่อสมาชิกก่อน'); return; }
    var ups=[];
    GP.parties.forEach(function(p){
      if(!gpDirty(p)) return;
      if(p.isNew && !gpCompact(p.members).length) return;
      ups.push({id:p.isNew?'':p.id, name:p.name.trim(), members:gpCompact(p.members), version:p.version});
    });
    if(!ups.length && !GP.deleted.length){ gpMsg(false,'ไม่มีการเปลี่ยนแปลงให้บันทึก'); return; }
    var btn=document.getElementById('gpSave'); btn.disabled=true; btn.textContent='กำลังบันทึก...';
    google.script.run.withSuccessHandler(function(r){
      btn.disabled=false; btn.textContent='บันทึก';
      if(r && r.parties){ GP.parties=r.parties.map(gpLocal); if(r.ok||r.conflict) GP.deleted=[]; paintGP(); }
      gpMsg(!!(r&&r.ok), r ? r.message : 'เกิดข้อผิดพลาด');
    }).withFailureHandler(function(err){
      btn.disabled=false; btn.textContent='บันทึก'; gpMsg(false,'ส่งข้อมูลไม่สำเร็จ: '+(err&&err.message?err.message:err));
    }).saveGuildParties(me,{upserts:ups,deletes:GP.deleted});
  }

  (function(){
    var body=document.getElementById('panelBody');
    body.addEventListener('click', function(e){
      var el=e.target.closest('[data-gp]'); if(!el || !document.getElementById('gpCards')) return;
      var g=el.dataset.gp, i=Number(el.dataset.i), s=Number(el.dataset.s), me=gpMe();
      if(g==='new'){ if(!me) return; GP.parties.push({id:'',name:'',version:0,members:['','','','',''],isNew:true,orig:''}); paintGP(); return; }
      var p=GP.parties[i];
      if(g==='del'){
        twoStep(el,function(){
          if(!p.isNew) GP.deleted.push({id:p.id,version:p.version});
          GP.parties.splice(i,1); paintGP();
        });
      } else if(g==='rm'){ p.members[s]=''; p.members=gpCompact(p.members).concat(['','','','','']).slice(0,5); paintGP(); }
      else if(g==='slot'){ if(gpEditable(p,me) && !p.members[s]) openGPPicker(i,Math.min(s,gpCompact(p.members).length)); }
    });
    body.addEventListener('input', function(e){
      if(e.target.classList.contains('gp-name')){ GP.parties[Number(e.target.dataset.i)].name=e.target.value; paintGPDirty(); }
    });
    var pick=document.getElementById('gpPick');
    document.getElementById('gpPickClose').addEventListener('click', closeGPPicker);
    pick.addEventListener('click', function(e){
      if(e.target===pick){ closeGPPicker(); return; }
      var b=e.target.closest('[data-gpm]'); if(!b) return;
      var p=GP.parties[GP.pickIdx]; if(!p){ closeGPPicker(); return; }
      p.members[GP.pickSlot]=b.dataset.gpm;               // ใส่ต่อจากคนสุดท้ายเสมอ (คนแรก = หัวปาร์ตี้)
      closeGPPicker(); paintGP();
    });
  })();

  /* =====================================================================
     ดูรายชื่อลงกิจกรรม (ฝั่งสมาชิก: ดูอย่างเดียว) — แสดงกระดานที่ Admin เผยแพร่แล้ว
     ===================================================================== */
  var NL = String.fromCharCode(10);
  var BOARD = {boards:[], members:[], activities:[], me:'', act:'', date:''};

  function todayStr(){
    var d=new Date(); function p(n){ return (n<10?'0':'')+n; }
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
  }
  function dmy(s){ var p=String(s).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : String(s); }
  function dateTh(s){
    var p=String(s).split('-'); if(p.length!==3) return String(s);
    try{
      return new Date(Number(p[0]),Number(p[1])-1,Number(p[2])).toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
    }catch(e){ return dmy(s); }
  }
  function timeTh(iso){
    try{ return new Date(iso).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return String(iso); }
  }

  function openEventsPanel(){
    openPanel('ดูรายชื่อลงกิจกรรม','<div class="loading">กำลังโหลด...</div>');
    google.script.run.withSuccessHandler(function(r){
      BOARD.boards = r.boards||[]; BOARD.members = r.members||[]; BOARD.activities = r.activities||[];
      try{ BOARD.me = localStorage.getItem('sg_me')||''; }catch(e){ BOARD.me=''; }
      // เริ่มที่ประเภทกิจกรรมที่มีกระดานเผยแพร่และยังไม่ผ่านไป (ถ้าไม่มี ใช้ประเภทแรก)
      var td=todayStr(), pick=BOARD.activities[0]||'';
      for(var i=0;i<BOARD.boards.length;i++){ if(BOARD.boards[i].date>=td){ pick=BOARD.boards[i].activity; break; } }
      BOARD.act = pick;
      BOARD.date = '';
      renderBoard();
    }).withFailureHandler(function(err){
      document.getElementById('panelBody').innerHTML='<div class="empty">โหลดไม่สำเร็จ: '+esc(err.message||err)+'</div>';
    }).getEventBoard();
  }

  function meMatch(){
    var q=BOARD.me.trim().toLowerCase(); if(!q) return '';
    for(var i=0;i<BOARD.members.length;i++){ if(BOARD.members[i].name.toLowerCase()===q) return BOARD.members[i].name; }
    return '';
  }
  function memberJob(n){
    var q=String(n).toLowerCase();
    for(var i=0;i<BOARD.members.length;i++){ if(BOARD.members[i].name.toLowerCase()===q) return BOARD.members[i].job; }
    return '';
  }

  function renderBoard(){
    var dl = BOARD.members.map(function(m){ return '<option value="'+esc(m.name)+'">'+esc(m.job)+'</option>'; }).join('');
    document.getElementById('panelBody').innerHTML =
      '<div class="field"><label for="meName">ชื่อตัวละครของคุณ (เลือกจากรายชื่อสมาชิกกิลด์)</label>'
      + '<input id="meName" list="meList" autocomplete="off" placeholder="พิมพ์ หรือเลือกจากรายชื่อ" value="'+esc(BOARD.me)+'">'
      + '<datalist id="meList">'+dl+'</datalist><div class="hint">ไม่พบชื่อนี้ในรายชื่อสมาชิกกิลด์</div></div>'
      + '<div id="meSummary"></div>'
      + '<div class="seg" id="mbTabs"></div><div id="mbDate"></div><div id="boardList"></div>';
    document.getElementById('meName').addEventListener('input', function(){
      BOARD.me=this.value; try{ localStorage.setItem('sg_me', BOARD.me); }catch(e){}
      paintMemberBoard();
    });
    document.getElementById('mbTabs').addEventListener('click', function(e){
      var b=e.target.closest('button[data-act]'); if(!b) return;
      BOARD.act=b.dataset.act; BOARD.date=''; paintMemberBoard();
    });
    document.getElementById('mbDate').addEventListener('change', function(e){
      if(e.target.id==='mbSel'){ BOARD.date=e.target.value; paintMemberBoard(); }
    });
    paintMemberBoard();
  }

  function paintMemberBoard(){
    var me = meMatch(), today = todayStr();
    document.getElementById('meName').parentNode.classList.toggle('err', BOARD.me.trim()!=='' && !me);

    // สรุป "คุณอยู่ตรงไหนบ้าง" จากทุกกระดานที่เผยแพร่และยังไม่ผ่านไป
    var mine=[];
    BOARD.boards.forEach(function(b){
      if(b.date<today) return;
      b.groups.forEach(function(g){ g.slots.forEach(function(party,pi){ party.forEach(function(n,si){
        if(me && n && n.toLowerCase()===me.toLowerCase()) mine.push(b.activity+' '+dmy(b.date)+' · '+g.name+' · ปาร์ตี้ '+(pi+1)+(si===0?' (หัวหน้าตี้)':''));
      }); }); });
    });
    document.getElementById('meSummary').innerHTML = me
      ? (mine.length ? '<div class="mysum in">✅ <b>'+esc(me)+'</b><br>'+mine.map(esc).join('<br>')+'</div>'
                     : '<div class="mysum out"><b>'+esc(me)+'</b> ยังไม่ได้ถูกจัดลงกิจกรรมใดที่เผยแพร่ไว้</div>')
      : '';

    document.getElementById('mbTabs').innerHTML = BOARD.activities.map(function(a){
      var n = BOARD.boards.filter(function(b){return b.activity===a;}).length;
      return '<button type="button" data-act="'+esc(a)+'" class="'+(a===BOARD.act?'on':'')+'">'+esc(a)+(n?' ('+n+')':'')+'</button>';
    }).join('');

    var list = BOARD.boards.filter(function(b){return b.activity===BOARD.act;});
    var dateBox = document.getElementById('mbDate'), out = document.getElementById('boardList');
    if(!list.length){ dateBox.innerHTML=''; out.innerHTML='<div class="empty">ยังไม่มีการเผยแพร่รายชื่อของ '+esc(BOARD.act)+'</div>'; return; }
    if(!BOARD.date || !list.some(function(b){return b.date===BOARD.date;})){
      var up=list.filter(function(b){return b.date>=today;});
      BOARD.date=(up[0]||list[list.length-1]).date;
    }
    dateBox.innerHTML='<div class="field" style="margin-top:10px"><label for="mbSel">วันที่</label><select id="mbSel" class="wide">'
      + list.map(function(b){ return '<option value="'+esc(b.date)+'" '+(b.date===BOARD.date?'selected':'')+'>'+esc(dateTh(b.date))+'</option>'; }).join('')+'</select></div>';

    var b = list.filter(function(x){return x.date===BOARD.date;})[0];
    out.innerHTML = '<div class="meta" style="color:#5b74a8;font-size:13px;margin-bottom:8px">อัปเดตล่าสุด '+esc(timeTh(b.publishedAt))+'</div>'
      + b.groups.map(function(g){
        var placed=0, cap=0; g.slots.forEach(function(p){ cap+=p.length; p.forEach(function(n){ if(n) placed++; }); });
        var parties = g.slots.map(function(party,pi){
          var cnt=0;
          var rows = party.map(function(n,si){
            if(n) cnt++;
            var isMe = me && n && n.toLowerCase()===me.toLowerCase();
            var job = n ? memberJob(n) : '';
            var lv = n && (b.leaves||[]).some(function(x){ return String(x).toLowerCase()===n.toLowerCase(); });
            return '<span class="mchip'+(n&&jobInfo(job)?' hj':'')+(isMe?' me':'')+(n?'':' empty')+(lv?' leave':'')+'"'+(n?jobStyle(job):'')+'><i>'+(si===0?(pi===0?'♛':'★'):'')+'</i>'
              +(n?jobIcon(job)+'<span class="jn">'+esc(n)+'</span>'+(job&&!jobInfo(job)?' <small>'+esc(job)+'</small>':'')+(isMe?' ⭐':''):'—')+'</span>';
          }).join('');
          return '<div class="pbox"><h4><span>ปาร์ตี้ '+(pi+1)+'</span><small>'+cnt+'/'+party.length+'</small></h4>'+rows+'</div>';
        }).join('');
        return '<div class="board-ev" style="border-top:5px solid '+(PAL[g.color]||(g.tag==='Sub'?PAL.blue:PAL.orange))+'"><h3>'+esc(g.name)+(g.lang?' <span class="badge b-ok">'+esc(g.lang)+'</span>':'')+' <small style="color:#5b74a8">'+placed+'/'+cap+'</small></h3>'
          +(g.note?'<div class="gnote">'+esc(g.note)+'</div>':'')
          +'<div class="pgrid">'+parties+'</div></div>';
      }).join('');
  }

  /* =====================================================================
     หลังบ้าน: กระดานจัดปาร์ตี้ (Siege / Guild League / Polarity Zone)
     ===================================================================== */
  var BD = {gparties:[], leaves:{}, activity:'', date:todayStr(), version:0, state:{groups:[]}, members:[], dates:[], prev:null,
            activities:[], partySize:5, maxParties:10, maxGroups:10, publishedAt:'', publishedBy:'', dirty:false};
  var SEL = null, DRAG = null, PICK = null, SETG = -1;
  var HIST = {undo:[], redo:[]};
  var SAVE = {timer:null, busy:false, status:'idle', msg:'', after:[]};
  var POOL = {q:'', job:''};
  var COLL = {};

  function callQuiet(fn, args, ok, fail){
    var run = google.script.run
      .withSuccessHandler(function(r){ if(r && r.expired){ adminExpired(); return; } ok(r); })
      .withFailureHandler(function(err){ if(fail) fail(err); });
    run[fn].apply(run, [ADMIN.token].concat(args||[]));
  }
  function jobOf(n){
    var q=String(n).toLowerCase();
    for(var i=0;i<BD.members.length;i++){ if(BD.members[i].name.toLowerCase()===q) return BD.members[i].job; }
    return '';
  }
  function placedMap(){
    var o={}; BD.state.groups.forEach(function(g){ g.slots.forEach(function(p){ p.forEach(function(n){ if(n) o[n.toLowerCase()]=true; }); }); });
    return o;
  }
  function onLeave(n){ return !!(n && BD.leaves && BD.leaves[String(n).toLowerCase()]); }
  function leaveIn(g){ var n=0; g.slots.forEach(function(p){ p.forEach(function(x){ if(onLeave(x)) n++; }); }); return n; }
  function leaveTotal(){ var n=0; BD.state.groups.forEach(function(g){ n+=leaveIn(g); }); return n; }
  function groupCount(g){ var n=0; g.slots.forEach(function(p){ p.forEach(function(x){ if(x) n++; }); }); return n; }
  function groupCap(g){ return g.parties*BD.partySize; }
  function totals(){
    var placed=0, cap=0; BD.state.groups.forEach(function(g){ placed+=groupCount(g); cap+=groupCap(g); }); return {placed:placed, cap:cap};
  }

  /* ----- โหลด / บันทึก ----- */
  function loadEv(){ flushSave(fetchBoard); }
  function fetchBoard(){
    callQuiet('adminGetBoard',[BD.activity||'Siege',BD.date],function(r){
      if(!r.ok){ errView(r.message); return; }
      BD.activities=r.activities; BD.partySize=r.partySize; BD.maxParties=r.maxParties; BD.maxGroups=r.maxGroups;
      if(!BD.activity || r.activities.indexOf(BD.activity)===-1) BD.activity=r.activities[0];
      BD.version=r.board.version; BD.state=r.board.state; BD.publishedAt=r.board.publishedAt; BD.publishedBy=r.board.publishedBy;
      BD.dirty=!!r.board.dirty; BD.leaves={}; (r.leaves||[]).forEach(function(n){ BD.leaves[String(n).toLowerCase()]=true; }); BD.members=r.members; BD.dates=r.dates; BD.prev=r.prev;
      HIST={undo:[],redo:[]}; SEL=null; SAVE.status='idle'; SAVE.msg='';
      renderShell(); loadGParties();
    }, function(err){ errView('โหลดไม่สำเร็จ: '+(err&&err.message?err.message:err)); });
  }

  function scheduleSave(){
    SAVE.status='dirty'; paintStatus();
    clearTimeout(SAVE.timer); SAVE.timer=setTimeout(doSave,700);
  }
  function runAfter(ok){ var a=SAVE.after; SAVE.after=[]; a.forEach(function(f){ f(ok); }); }
  function doSave(){
    clearTimeout(SAVE.timer); SAVE.timer=null;
    if(SAVE.busy) return;
    SAVE.busy=true; SAVE.status='saving'; paintStatus();
    var snap=JSON.stringify(BD.state), act=BD.activity, date=BD.date;
    callQuiet('adminSaveBoard',[act,date,BD.version,BD.state],function(r){
      SAVE.busy=false;
      if(act!==BD.activity || date!==BD.date){ runAfter(true); return; }
      if(r.ok){
        BD.version=r.version;
        if(JSON.stringify(BD.state)!==snap){ doSave(); return; }   // มีการแก้ระหว่างบันทึก -> บันทึกซ้ำ
        SAVE.status='saved'; paintStatus(); runAfter(true);
      } else {
        SAVE.status = r.conflict ? 'conflict' : 'error'; SAVE.msg = r.message||''; paintStatus(); runAfter(false);
        notice(false, r.message||'บันทึกไม่สำเร็จ');
      }
    }, function(err){
      SAVE.busy=false; SAVE.status='error'; SAVE.msg=(err&&err.message)||''; paintStatus(); runAfter(false);
    });
  }
  function flushSave(cb){
    if(SAVE.status==='idle' || SAVE.status==='saved'){ cb(true); return; }
    if(SAVE.status==='conflict' || SAVE.status==='error'){ cb(false); return; }
    SAVE.after.push(cb);
    if(!SAVE.busy) doSave();
  }

  /* ----- แก้ไข state (รองรับ undo/redo) ----- */
  function mutate(fn){
    HIST.undo.push(JSON.stringify(BD.state)); if(HIST.undo.length>60) HIST.undo.shift();
    HIST.redo=[];
    fn(BD.state);
    if(BD.publishedAt) BD.dirty=true;
    SEL=null; paintAll(); scheduleSave();
  }
  function undo(){ if(!HIST.undo.length) return; HIST.redo.push(JSON.stringify(BD.state)); BD.state=JSON.parse(HIST.undo.pop()); afterJump(); }
  function redo(){ if(!HIST.redo.length) return; HIST.undo.push(JSON.stringify(BD.state)); BD.state=JSON.parse(HIST.redo.pop()); afterJump(); }
  function afterJump(){ if(BD.publishedAt) BD.dirty=true; SEL=null; paintAll(); scheduleSave(); }

  function removeName(S,name){
    var q=name.toLowerCase();
    S.groups.forEach(function(g){ g.slots.forEach(function(p){ for(var i=0;i<p.length;i++){ if(p[i] && p[i].toLowerCase()===q) p[i]=''; } }); });
  }
  function putInSlot(g,p,s,name){
    var gp=gpOfName(name);
    if(ASKGP && gp && gp.members.length>1 && !placedMap()[name.toLowerCase()]
       && gp.members.some(function(m){ return m.toLowerCase()!==name.toLowerCase() && !placedMap()[m.toLowerCase()]; })){
      openGPAsk(g,p,s,name,gp); return;
    }
    putSingle(g,p,s,name);
  }
  function swapSlots(a,b){
    mutate(function(S){
      var x=S.groups[a.g].slots[a.p][a.s], y=S.groups[b.g].slots[b.p][b.s];
      S.groups[a.g].slots[a.p][a.s]=y; S.groups[b.g].slots[b.p][b.s]=x;
    });
  }
  function clearSlot(g,p,s){ mutate(function(S){ S.groups[g].slots[p][s]=''; }); }
  function slotName(r){ return BD.state.groups[r.g].slots[r.p][r.s]; }
  function ref(el){ return {g:Number(el.dataset.g), p:Number(el.dataset.p), s:Number(el.dataset.s)}; }
  function sameRef(a,b){ return a.g===b.g && a.p===b.p && a.s===b.s; }

  /* ----- วางทั้งตี้ประจำลงกระดาน ----- */
  var ASKGP = true; try{ ASKGP = localStorage.getItem('sg_askgp')!=='0'; }catch(e){}
  var GPA = null;
  function gpFind(id){ for(var i=0;i<BD.gparties.length;i++){ if(BD.gparties[i].id===id) return BD.gparties[i]; } return null; }
  function gpOfName(name){
    var q=String(name).toLowerCase();
    for(var i=0;i<BD.gparties.length;i++){
      if(BD.gparties[i].members.some(function(m){ return m.toLowerCase()===q; })) return BD.gparties[i];
    }
    return null;
  }
  function gpLabel(p){ return p.name || ('ตี้ประจำ '+(BD.gparties.indexOf(p)+1)); }
  function loadGParties(){
    google.script.run.withSuccessHandler(function(r){
      BD.gparties=(r&&r.parties)||[]; paintPool();
    }).withFailureHandler(function(){}).getGuildParties();
  }
  /** วางรายชื่อ names ลงปาร์ตี้ (g,p) โดยคนแรกลงช่อง s ถ้าว่าง ที่เหลือลงช่องว่างตามลำดับ — คนที่อยู่ในปาร์ตี้นี้แล้วคงเดิม */
  function placeParty(g,p,s,names){
    var party=BD.state.groups[g].slots[p], inP={};
    party.forEach(function(n){ if(n) inP[n.toLowerCase()]=true; });
    var need=names.filter(function(n){ return !inP[n.toLowerCase()]; });
    if(!need.length){ notice(true,'ทุกคนอยู่ในปาร์ตี้ '+(p+1)+' อยู่แล้ว'); return false; }
    var avail=[];   // เรียงจากช่องบนลงล่าง เพื่อให้คนแรกของตี้ประจำเป็นหัวปาร์ตี้
    for(var k=0;k<party.length;k++){ if(!party[k]) avail.push(k); }
    if(need.length>avail.length){
      notice(false,'ปาร์ตี้ '+(p+1)+' ว่างไม่พอ (ต้องการ '+need.length+' ช่อง ว่าง '+avail.length+' ช่อง)'); return false;
    }
    mutate(function(S){
      need.forEach(function(n,i){ removeName(S,n); S.groups[g].slots[p][avail[i]]=n; });
    });
    return true;
  }
  function placeGP(g,p,s,id){
    var gp=gpFind(id); if(!gp) return;
    var placed=placedMap(), party=BD.state.groups[g].slots[p].map(function(n){ return String(n).toLowerCase(); });
    var names=[], skipped=[];
    gp.members.forEach(function(n){
      var k=n.toLowerCase();
      if(party.indexOf(k)!==-1 || !placed[k]) names.push(n); else skipped.push(n);
    });
    if(!names.length){ notice(false,'สมาชิกของตี้นี้ถูกวางอยู่ในปาร์ตี้อื่นแล้วทั้งหมด'); SEL=null; paintPool(); return; }
    if(placeParty(g,p,s,names) && skipped.length) notice(true,'วางแล้ว · ข้าม '+skipped.map(esc).join(', ')+' เพราะอยู่ในปาร์ตี้อื่นอยู่แล้ว');
  }
  function openGPAsk(g,p,s,name,gp){
    GPA={g:g,p:p,s:s,name:name,id:gp.id};
    var others=gp.members.filter(function(m){ return m.toLowerCase()!==name.toLowerCase(); });
    openModal('วางทั้งตี้ หรือคนเดียว?','<p style="margin-bottom:12px"><b>'+esc(name)+'</b> อยู่ในตี้ประจำ <b>'+esc(gpLabel(gp))+'</b><br><span style="color:#5b74a8">'
      +esc(gp.members.join(', '))+'</span></p>'
      +'<div class="btnrow"><button type="button" class="btn sm" data-m="gpa-all">วางทั้งตี้ ('+gp.members.length+' คน)</button>'

      +'<div class="hint" style="display:block;margin-top:8px">ปิดคำถามนี้ได้ที่ช่องติ๊กในรายการ "ตี้ประจำ" ด้านซ้าย ('+others.length+' คนที่เหลือ)</div>');
  }
  function putSingle(g,p,s,name){ mutate(function(S){ removeName(S,name); S.groups[g].slots[p][s]=name; }); }

  function boardText(only){
    var L=[]; L.push('SAILOR · '+BD.activity+' · '+dmy(BD.date));
    BD.state.groups.forEach(function(g,gi){
      if(only!==undefined && only!==gi) return;
      L.push(''); L.push('['+g.name+']'+(g.lang?' ('+g.lang+')':'')+' · '+groupCount(g)+'/'+groupCap(g));
      if(g.note) L.push('📝 '+g.note);
      g.slots.forEach(function(p,pi){
        L.push('ปาร์ตี้ '+(pi+1)+': '+p.map(function(n){ return n ? (onLeave(n)?n+' (ลา)':n) : '-'; }).join(', '));
      });
    });
    return L.join(NL);
  }
  function openText(){
    openModal('คัดลอกข้อความ','<textarea id="txOut" class="tx" rows="14" readonly>'+esc(boardText())+'</textarea>'
      + '<div class="btnrow" style="margin-top:10px"><button type="button" class="btn sm" data-m="copy">คัดลอก</button></div><div class="msg" id="txMsg"></div>');
    var t=document.getElementById('txOut'); t.focus(); t.select();
  }
  function doCopy(){
    var t=document.getElementById('txOut'), m=document.getElementById('txMsg');
    function ok(){ m.className='msg ok'; m.textContent='คัดลอกแล้ว'; }
    function fallback(){
      try{ t.focus(); t.select(); if(document.execCommand('copy')) ok(); else { m.className='msg bad'; m.textContent='คัดลอกอัตโนมัติไม่ได้ — กด Ctrl+C ได้เลย (เลือกข้อความไว้แล้ว)'; } }
      catch(e){ m.className='msg bad'; m.textContent='คัดลอกอัตโนมัติไม่ได้ — กด Ctrl+C ได้เลย (เลือกข้อความไว้แล้ว)'; }
    }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t.value).then(ok, fallback); } else fallback();
  }

  // วาดรูปกระดานลง canvas แล้วแสดงในป๊อปอัป (กดดาวน์โหลดหรือกดค้างเพื่อบันทึก)
  function openImage(only){
    var groups=BD.state.groups.filter(function(g,gi){ return only===undefined || only===gi; });
    if(!groups.length){ notice(false,'ยังไม่มี Raid ให้บันทึกรูป'); return; }
    var W=210, SH=30, PAD=18, GAP=10, PER=6, HEAD=34, TITLE=54;
    var width = PAD*2 + PER*W + (PER-1)*GAP;
    var heights = groups.map(function(g){ var rows=Math.ceil(g.parties/PER); return 46 + rows*(HEAD+BD.partySize*SH+10) + (g.note?26:0); });
    var height = TITLE + heights.reduce(function(a,b){return a+b;},0) + PAD;
    var c=document.createElement('canvas'); c.width=width; c.height=height;
    var x=c.getContext('2d'), FONT='Kanit, "Noto Sans Thai", Tahoma, sans-serif';
    x.fillStyle='#eaf6ff'; x.fillRect(0,0,width,height);
    x.fillStyle='#14316b'; x.font='700 24px '+FONT; x.textBaseline='middle';
    x.fillText('⚓ SAILOR · '+BD.activity+' · '+dmy(BD.date), PAD, 30);
    var y=TITLE;
    groups.forEach(function(g,k){
      x.fillStyle=PAL[colorOf(g)]; x.fillRect(PAD,y,width-PAD*2,36);
      x.fillStyle='#fff'; x.font='600 18px '+FONT; x.fillText(g.name+(g.lang?'  ['+g.lang+']':'')+'  '+groupCount(g)+'/'+groupCap(g), PAD+12, y+19);
      var yy=y+46;
      if(g.note){ x.fillStyle='#7a5b00'; x.font='400 14px '+FONT; x.fillText('📝 '+g.note.slice(0,90), PAD+4, yy+8); yy+=26; }
      g.slots.forEach(function(party,pi){
        var col=pi%PER, row=Math.floor(pi/PER);
        var px=PAD+col*(W+GAP), py=yy+row*(HEAD+BD.partySize*SH+10);
        x.fillStyle='#fff'; x.fillRect(px,py,W,HEAD+BD.partySize*SH);
        x.strokeStyle='#a9d8ff'; x.lineWidth=2; x.strokeRect(px,py,W,HEAD+BD.partySize*SH);
        x.fillStyle='#14316b'; x.font='600 15px '+FONT; x.fillText('ปาร์ตี้ '+(pi+1), px+10, py+HEAD/2);
        party.forEach(function(n,si){
          var sy=py+HEAD+si*SH;
          if(si===0){ x.fillStyle='#f3ebdd'; x.fillRect(px+2,sy,W-4,SH); }
          x.fillStyle = n ? '#14316b' : '#9aa7c2'; x.font=(n?'600':'400')+' 14px '+FONT;
          var lbl=(si===0?(pi===0?'♛ ':'★ '):'')+(n||'—');
          x.fillText(lbl+(onLeave(n)?' (ลา)':''), px+10, sy+SH/2);
          if(onLeave(n)){ var tw=x.measureText(lbl+(onLeave(n)?' (ลา)':'')).width; x.fillRect(px+10, sy+SH/2, tw, 2); }
        });
      });
      y+=heights[k];
    });
    var url=c.toDataURL('image/png');
    openModal('บันทึกรูป','<img class="bd-img" src="'+url+'" alt="กระดานปาร์ตี้">'
      + '<div class="btnrow" style="margin-top:10px"><a class="btn sm" style="text-decoration:none;text-align:center" download="sailor-'+esc(BD.activity.split(' ').join('-'))+'-'+esc(BD.date)+'.png" href="'+url+'">ดาวน์โหลดรูป</a></div>'
      + '<small style="color:#5b74a8">ถ้ากดดาวน์โหลดไม่ได้ ให้คลิกขวา/กดค้างที่รูปแล้วเลือกบันทึกรูป</small>');
  }

  /* ----- การกระทำต่าง ๆ ----- */
  function addGroup(){
    if(BD.state.groups.length>=BD.maxGroups){ notice(false,'เพิ่ม Raid ได้สูงสุด '+BD.maxGroups+' กลุ่ม'); return; }
        mutate(function(S){
      var slots=[]; for(var i=0;i<6;i++){ var p=[]; for(var k=0;k<BD.partySize;k++) p.push(''); slots.push(p); }
      S.groups.push({id:Math.random().toString(36).slice(2,10), name:'Raid '+(S.groups.length+1), tag:'Main', color:'orange', lang:'', parties:6, note:'', slots:slots});
    });
  }
  function setPartyCount(gi,n){
    mutate(function(S){
      var g=S.groups[gi]; g.parties=n;
      while(g.slots.length<n){ var p=[]; for(var k=0;k<BD.partySize;k++) p.push(''); g.slots.push(p); }
      g.slots.length=n;
    });
  }
  function copyPrev(){
    var memberKey={}; BD.members.forEach(function(m){ memberKey[m.name.toLowerCase()]=m.name; });
    var used={};
    mutate(function(S){
      var prev=JSON.parse(JSON.stringify(BD.prev.state));
      prev.groups.forEach(function(g){
        g.id=Math.random().toString(36).slice(2,10);
        g.slots.forEach(function(p){ for(var i=0;i<p.length;i++){
          var k=(p[i]||'').toLowerCase();
          if(k && memberKey[k] && !used[k]){ used[k]=true; p[i]=memberKey[k]; } else p[i]='';
        } });
      });
      S.groups=prev.groups;
    });
  }

  function bdAction(el){
    var a=el.dataset.a, gi=Number(el.dataset.g);
    if(a==='bd-act'){
      flushSave(function(){ BD.activity=el.dataset.act; loadEv(); });
    } else if(a==='bd-publish'){
      el.disabled=true;
      flushSave(function(ok){
        if(!ok){ el.disabled=false; return; }
        callQuiet('adminPublishBoard',[BD.activity,BD.date],function(r){
          el.disabled=false;
          if(r.ok){ BD.publishedAt=r.publishedAt; BD.publishedBy=r.publishedBy; BD.dirty=false; BD.dates=BD.dates.filter(function(d){return d.date!==BD.date;}); BD.dates.unshift({date:BD.date,published:true}); paintAll(); }
          notice(r.ok,r.message);
        }, function(err){ el.disabled=false; notice(false,'ส่งข้อมูลไม่สำเร็จ'); });
      });
    } else if(a==='bd-unpub'){
      twoStep(el,function(){
        callQuiet('adminUnpublishBoard',[BD.activity,BD.date],function(r){
          if(r.ok){ BD.publishedAt=''; BD.publishedBy=''; BD.dirty=false; paintAll(); }
          notice(r.ok,r.message);
        });
      });
    } else if(a==='bd-undo'){ undo();
    } else if(a==='bd-redo'){ redo();
    } else if(a==='bd-copyprev'){
      twoStep(el,function(){ copyPrev(); });
    } else if(a==='bd-att'){
      flushSave(function(ok){
        if(!ok){ notice(false,'กรุณารอให้กระดานบันทึกให้เสร็จ (หรือแก้ปัญหาการบันทึก) ก่อนเช็คชื่อ'); return; }
        ATD.activity=BD.activity; ATD.date=BD.date; switchTab('att');
      });
    } else if(a==='bd-text'){ openText();
    } else if(a==='bd-img'){ openImage();
    } else if(a==='bd-gimg'){ openImage(gi);
    } else if(a==='bd-addg'){ addGroup();
    } else if(a==='bd-collapse'){ var id=BD.state.groups[gi].id; COLL[id]=!COLL[id]; paintGroups();
    } else if(a==='bd-settings'){ openSettings(gi);
    } else if(a==='bd-gup'){ if(gi>0) mutate(function(S){ var t=S.groups[gi]; S.groups[gi]=S.groups[gi-1]; S.groups[gi-1]=t; });
    } else if(a==='bd-gdown'){ if(gi<BD.state.groups.length-1) mutate(function(S){ var t=S.groups[gi]; S.groups[gi]=S.groups[gi+1]; S.groups[gi+1]=t; });
    } else if(a==='bd-gdel'){
      twoStep(el,function(){ mutate(function(S){ S.groups.splice(gi,1); }); });
    } else if(a==='bd-rm'){ clearSlot(gi, Number(el.dataset.p), Number(el.dataset.s));
    } else if(a==='bd-addm'){ openAddMember();
    }
  }

  function slotClick(el){
    var r=ref(el), name=slotName(r);
    if(SEL && SEL.type==='gp'){ var gid=SEL.id; SEL=null; paintPool(); placeGP(r.g,r.p,r.s,gid); return; }
    if(SEL && SEL.type==='name'){ putInSlot(r.g,r.p,r.s,SEL.name); return; }
    if(SEL && SEL.type==='slot'){
      if(sameRef(SEL,r)){ SEL=null; paintGroups(); return; }
      swapSlots(SEL,r); return;
    }
    if(name){ SEL={type:'slot',g:r.g,p:r.p,s:r.s}; paintGroups(); }
    else openPicker(r);
  }
  function selectName(name){
    SEL = (SEL && SEL.type==='name' && SEL.name===name) ? null : {type:'name',name:name};
    paintPool(); paintGroups();
  }

  /* ----- ตัวจัดการเหตุการณ์ของหน้าจัดปาร์ตี้ ----- */
  (function(){
    var body=document.getElementById('adBody');
    body.addEventListener('click', function(e){
      if(CUR_TAB!=='ev') return;
      var el=e.target.closest('[data-a]');
      if(el && el.dataset.a.indexOf('bd-')===0 && !el.disabled){ bdAction(el); return; }
      var gc=e.target.closest('.gpc');
      if(gc){ var gid=gc.dataset.gpp; SEL=(SEL&&SEL.type==='gp'&&SEL.id===gid)?null:{type:'gp',id:gid}; paintPool(); paintGroups(); return; }
      var slot=e.target.closest('.slot'); if(slot){ slotClick(slot); return; }
      var chip=e.target.closest('.pchip');
      if(chip){
        if(SEL && SEL.type==='slot'){ putInSlot(SEL.g,SEL.p,SEL.s,chip.dataset.name); return; }   // แตะช่องก่อน แล้วแตะชื่อ
        selectName(chip.dataset.name); return;
      }
      // แตะช่องที่เลือกไว้ แล้วแตะพื้นที่ "ยังไม่ได้วาง" = เอาออกจากปาร์ตี้
      if(SEL && SEL.type==='slot' && e.target.closest('.pool') && !e.target.closest('input,select,button')){ clearSlot(SEL.g,SEL.p,SEL.s); }
    });
    body.addEventListener('change', function(e){
      if(CUR_TAB!=='ev') return;
      var t=e.target;
      if(t.classList.contains('pcount')){ setPartyCount(Number(t.dataset.g), Number(t.value)); }
      else if(t.id==='poolJob'){ POOL.job=t.value; paintPool(); }
      else if(t.id==='gpAsk'){ ASKGP=t.checked; try{ localStorage.setItem('sg_askgp', ASKGP?'1':'0'); }catch(err){} }
      else if(t.id==='bdDate' || t.id==='bdDates'){
        var v=t.value; if(!v) return;
        flushSave(function(){ BD.date=v; loadEv(); });
      }
    });
    body.addEventListener('input', function(e){ if(e.target.id==='poolQ'){ POOL.q=e.target.value; paintPool(); } });

    // ลากวาง (เดสก์ท็อป) — บนมือถือใช้แตะเลือกชื่อ/แตะช่องแทน
    body.addEventListener('dragstart', function(e){
      var s=e.target.closest && e.target.closest('.slot.filled'), c=e.target.closest && e.target.closest('.pchip'), gc=e.target.closest && e.target.closest('.gpc');
      if(s){ DRAG={type:'slot',ref:ref(s)}; s.classList.add('drag'); }
      else if(gc){ DRAG={type:'gp',id:gc.dataset.gpp}; gc.classList.add('drag'); }
      else if(c){ DRAG={type:'name',name:c.dataset.name}; c.classList.add('drag'); }
      else return;
      try{ e.dataTransfer.setData('text/plain','x'); e.dataTransfer.effectAllowed='move'; }catch(err){}
    });
    body.addEventListener('dragend', function(){
      DRAG=null; document.querySelectorAll('.drag,.over').forEach(function(n){ n.classList.remove('drag','over'); });
    });
    body.addEventListener('dragover', function(e){
      if(!DRAG) return;
      var s=e.target.closest('.slot'), pl=e.target.closest('.pool');
      if(s || (pl && DRAG.type==='slot')){ e.preventDefault(); document.querySelectorAll('.over').forEach(function(n){ n.classList.remove('over'); }); (s||pl).classList.add('over'); }
    });
    body.addEventListener('drop', function(e){
      if(!DRAG) return;
      var s=e.target.closest('.slot'), pl=e.target.closest('.pool'), d=DRAG; DRAG=null;
      document.querySelectorAll('.drag,.over').forEach(function(n){ n.classList.remove('drag','over'); });
      if(s){
        e.preventDefault(); var r=ref(s);
        if(d.type==='name') putInSlot(r.g,r.p,r.s,d.name);
        else if(d.type==='gp') placeGP(r.g,r.p,r.s,d.id);
        else if(!sameRef(d.ref,r)) swapSlots(d.ref,r);
      } else if(pl && d.type==='slot'){
        e.preventDefault(); clearSlot(d.ref.g,d.ref.p,d.ref.s);
      }
    });

    // ป๊อปอัป
    var mdl=document.getElementById('adModal');
    document.getElementById('mdlClose').addEventListener('click', closeModal);
    mdl.addEventListener('click', function(e){ if(e.target===mdl) closeModal(); });
    mdl.addEventListener('input', function(e){ if(e.target.id==='pkQ') paintPicker(e.target.value); });
    mdl.addEventListener('click', function(e){
      var b=e.target.closest('[data-m]'); if(!b) return;
      var m=b.dataset.m;
      if(m==='gpa-all' && GPA){
        var a=GPA; GPA=null; closeModal(); var gp=gpFind(a.id);
        if(gp){
          var placed=placedMap(), names=gp.members.filter(function(n){ return n.toLowerCase()===a.name.toLowerCase() || !placed[n.toLowerCase()]; });
          placeParty(a.g,a.p,a.s,names);
        }
      } else if(m==='gpa-one' && GPA){ var b2=GPA; GPA=null; closeModal(); putSingle(b2.g,b2.p,b2.s,b2.name); }
      else if(m==='pick' && PICK){ var r=PICK; closeModal(); putInSlot(r.g,r.p,r.s,b.dataset.name); }
      else if(m==='copy'){ doCopy(); }
      else if(m==='glang'){ SETL=b.dataset.l; paintSettingsOpts(); }
      else if(m==='gcolor'){ SETC=b.dataset.c; paintSettingsOpts(); }
      else if(m==='gsave' && SETG>-1){
        var gi=SETG, nm=document.getElementById('stName').value.trim(), nt=document.getElementById('stNote').value.trim();
        var np=Number(document.getElementById('stParties').value), lg=SETL, cl=SETC;
        closeModal();
        mutate(function(S){
          var g=S.groups[gi]; g.name=nm||g.name; g.note=nt; g.lang=lg; g.color=cl;
          if(np!==g.parties){
            g.parties=np;
            while(g.slots.length<np){ var p=[]; for(var k=0;k<BD.partySize;k++) p.push(''); g.slots.push(p); }
            g.slots.length=np;
          }
        });
      } else if(m==='gup' && SETG>0){
        var u=SETG; closeModal(); mutate(function(S){ var t=S.groups[u]; S.groups[u]=S.groups[u-1]; S.groups[u-1]=t; });
      } else if(m==='gdown' && SETG>-1 && SETG<BD.state.groups.length-1){
        var d=SETG; closeModal(); mutate(function(S){ var t=S.groups[d]; S.groups[d]=S.groups[d+1]; S.groups[d+1]=t; });
      } else if(m==='gclear' && SETG>-1){
        twoStep(b,function(){ var c0=SETG; closeModal(); mutate(function(S){ S.groups[c0].slots.forEach(function(p){ for(var i=0;i<p.length;i++) p[i]=''; }); }); });
      } else if(m==='gdel' && SETG>-1){
        twoStep(b,function(){ var x0=SETG; closeModal(); mutate(function(S){ S.groups.splice(x0,1); }); });
      } else if(m==='addm'){
        var n=document.getElementById('nmName').value.trim(), j=document.getElementById('nmJob').value.trim(), msg=document.getElementById('nmMsg');
        if(!n){ msg.className='msg bad'; msg.textContent='กรุณากรอกชื่อตัวละคร'; return; }
        b.disabled=true;
        callQuiet('adminAddMembers',[[{name:n,job:j}]],function(r){
          b.disabled=false;
          if(r.ok && r.added){ BD.members.push({name:n,job:j}); BD.members.sort(function(x,y){ return x.name.toLowerCase()<y.name.toLowerCase()?-1:1; }); closeModal(); paintPool(); notice(true,r.message); }
          else { msg.className='msg bad'; msg.textContent=r.message||'เพิ่มไม่สำเร็จ'; }
        }, function(){ b.disabled=false; msg.className='msg bad'; msg.textContent='ส่งข้อมูลไม่สำเร็จ'; });
      }
    });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
  })();

  /* =====================================================================
     หลังบ้าน: แจ้งลา
     ===================================================================== */
  var LV = {days:[], leaves:[], members:[], day:'', activities:[], slots:[], cutoff:45, orig:''};
  function lsSig(){ return JSON.stringify([LV.cutoff, LV.slots.map(function(s){ return [s.activity,s.day,s.meet,s.note]; })]); }
  function loadLv(cb){
    call('adminListLeaves',[],function(r){
      if(!r.ok){ errView(r.message); return; }
      LV.days=r.days; LV.leaves=r.leaves; LV.members=r.members; LV.activities=r.activities;
      LV.slots=r.slots.map(function(s){ return {activity:s.activity,day:s.day,meet:s.meet,note:s.note}; }); LV.cutoff=r.cutoff; LV.orig=lsSig();
      if(!LV.day || LV.days.indexOf(LV.day)===-1) LV.day=LV.days[0];
      renderLv(); if(cb) cb();
    });
  }
  function lvActTag(l){ return l.activity ? '<span class="stag">'+esc(l.activity)+'</span>' : '<span class="stag">ทุกกิจกรรม</span>'; }
  function renderLv(){
    var cnt={}; LV.leaves.forEach(function(l){ cnt[l.date]=(cnt[l.date]||0)+1; });

    }).join('');
    var today = LV.leaves.filter(function(l){ return l.date===LV.day; });
    var rows = today.map(function(l){
      var job=''; LV.members.forEach(function(m){ if(m.name.toLowerCase()===l.name.toLowerCase()) job=m.job; });
      return '<div class="row"><div><b>'+esc(l.name)+'</b>'+(job?' <small>'+esc(job)+'</small>':'')+' '+lvActTag(l)
        +(l.late?' <span class="lvtag" title="เพิ่มหลังเลยเวลาปิดรับ — ตัดสินเองตอนเช็คชื่อว่าเป็นลาหรือขาด">แจ้งลาช้า</span>':'')
        +(l.reason?'<div class="meta">'+esc(l.reason)+'</div>':'')+'<div class="meta">'+esc(l.source)+'</div></div>'
        +'<div><button class="mini danger" data-a="lv-del" data-id="'+esc(l.id)+'">ลบ</button></div></div>';
    }).join('');
    var members = LV.members.map(function(m){ return '<option value="'+esc(m.name)+'">'+esc(m.name)+(m.job?' · '+esc(m.job):'')+'</option>'; }).join('');
    var acts = '<option value="">ทุกกิจกรรมของวันนี้</option>'+LV.activities.map(function(a){ return '<option value="'+esc(a)+'">'+esc(a)+'</option>'; }).join('');
    content().innerHTML =
      '<div class="ad-card"><h3>🌴 รายการแจ้งลา <span class="info" title="สมาชิกแจ้งลาเองบนหน้าสมาชิกด้วย PIN หรือทีมงานเพิ่มให้ คนที่ไม่ได้แจ้งถือว่ามา">i</span></h3>'
      + '<p class="gp-desc" style="margin-bottom:12px">สมาชิกแจ้งลาเองบนหน้าสมาชิกด้วย PIN หรือทีมงานเพิ่มให้ คนที่ไม่ได้แจ้งถือว่ามา · สมาชิกแจ้งลาได้ถึง '+LV.cutoff+' นาทีก่อนเวลานัดพบของแต่ละกิจกรรม</p>'
      + '<div class="lv-days" id="lvDays">'+chips+'</div></div>'
      + '<div class="ad-card"><h3>ลา '+today.length+' รายการ <small style="color:#5b74a8;font-weight:400">· '+esc(dmy(LV.day))+'</small></h3>'
      + (rows||'<div class="empty" style="padding:12px">ไม่มีใครแจ้งลาวันนี้</div>')
      + '<div class="lv-add"><select id="lvMember"><option value="">เลือกสมาชิก...</option>'+members+'</select><select id="lvAct">'+acts+'</select>'
      + '<input id="lvReason" maxlength="100" placeholder="เหตุผล (ไม่บังคับ)" autocomplete="off">'
      + '<button type="button" class="btn sm" data-a="lv-add">+ เพิ่มการลา</button></div>'
      + '<div class="hint" style="display:block;margin-top:6px">ทีมงานเพิ่มการลาได้แม้เลยเวลาปิดรับ — รายการนั้นจะมีป้าย "แจ้งลาช้า" ให้ตัดสินใจตอนเช็คชื่อ</div></div>'
      + lsCardHtml();
  }
  function lsCardHtml(){
    var dirty = lsSig()!==LV.orig;
    var dayOpts=function(v){ var o=''; for(var d=1; d<=7; d++) o+='<option value="'+d+'" '+(d===v?'selected':'')+'>'+CAL_DAYS[d]+'</option>'; return o; };
    var actOpts=function(v){ return LV.activities.map(function(a){ return '<option '+(a===v?'selected':'')+'>'+esc(a)+'</option>'; }).join(''); };
    var rows=LV.slots.map(function(s,i){

    }).join('');
    return '<div class="ad-card" id="lsCard"><h3>⏰ ตารางนัดหมาย & เวลาปิดรับแจ้งลา</h3>'
      + '<p class="gp-desc" style="margin-bottom:10px">กำหนดวันและเวลานัดพบของกิลด์สำหรับแต่ละกิจกรรม สมาชิกจะเลือกลาตามรอบเหล่านี้ และระบบปิดรับก่อนเวลานัดพบตามจำนวนนาทีด้านล่าง (เวลาไทย)</p>'
      + (rows||'<div class="empty" style="padding:10px">ยังไม่มีรอบกิจกรรม — สมาชิกจะแจ้งลาเองไม่ได้</div>')
      + '<button type="button" class="cal-add" data-a="ls-add">＋ เพิ่มรอบ</button>'
      + '<div class="field" style="margin-top:12px;max-width:340px"><label for="lsCut">ปิดรับแจ้งลาก่อนเวลานัดพบ (นาที)</label><input id="lsCut" data-ls="cutoff" type="number" min="0" max="720" step="1" value="'+LV.cutoff+'"></div>'
      + '<div class="cal-save"><button type="button" class="btn sm" data-a="ls-save" '+(dirty?'':'disabled')+'>บันทึกตารางนัดหมาย</button>'

  function lsDirtyPaint(){

    if(b) b.disabled=!d; if(t) t.textContent=d?'● มีการแก้ไขที่ยังไม่ได้บันทึก':'';
  }
  function lvAfter(r){ loadLv(function(){ notice(r.ok, r.message); }); }
  (function(){
    var body=document.getElementById('adBody');

      var f=e.target.dataset && e.target.dataset.ls; if(!f) return;
      if(f==='cutoff'){ LV.cutoff=Number(e.target.value); }

      lsDirtyPaint();
    });
    body.addEventListener('change', function(e){
      var f=e.target.dataset && e.target.dataset.ls; if(!f || f==='cutoff' || f==='note' || f==='meet') return;
      var s=LV.slots[Number(e.target.dataset.i)]; if(s) s[f]=(f==='day')?Number(e.target.value):e.target.value; lsDirtyPaint();
    });
    body.addEventListener('click', function(e){
      var b = e.target.closest('button[data-a]'); if(!b) return;
      var a = b.dataset.a; if(a.indexOf('lv-')!==0 && a.indexOf('ls-')!==0) return;

      else if(a==='lv-add'){
        var n=document.getElementById('lvMember').value;
        if(!n){ notice(false,'กรุณาเลือกสมาชิก'); return; }
        call('adminAddLeave',[n,LV.day,document.getElementById('lvReason').value.trim(),document.getElementById('lvAct').value],lvAfter);

          if(r.ok){ lvAfter(r); } else { b.disabled=false; notice(false,r.message); }
        });

    });
  })();

  /* =====================================================================
     หลังบ้าน: เช็คชื่อ (หน้าต่างบนกระดาน) + สถิติทั้งกิลด์

  var AT = {roster:[], st:[], leaves:{}, source:''};
  function openAttend(){
    flushSave(function(ok){
      if(!ok){ notice(false,'กรุณารอให้กระดานบันทึกให้เสร็จ (หรือแก้ปัญหาการบันทึก) ก่อนเช็คชื่อ'); return; }
      callQuiet('adminGetAttendance',[BD.activity,BD.date],function(r){
        if(!r.ok){ notice(false,r.message); return; }
        AT.roster=r.roster; AT.leaves=r.leaves||{}; AT.source=r.source;
        AT.st=r.roster.map(function(x){ return r.marks[x.name.toLowerCase()]||''; });
        openModal('✅ เช็คชื่อ · '+BD.activity+' · '+dmy(BD.date),'<div id="atBody"></div>');
        document.getElementById('adModal').querySelector('.mdl-box').classList.add('wide');

      },function(err){ notice(false,'โหลดไม่สำเร็จ: '+(err&&err.message?err.message:err)); });

    var box=document.getElementById('atBody'); if(!box) return;

      rows+='<div class="at-row"><div class="at-nm">'+(x.lead?'★ ':'')+'<b>'+esc(x.name)+'</b>'+(lv==='late'?' <span class="lvtag" title="แจ้งลาหลังเลยเวลาปิดรับ — เลือกเองว่าลาหรือขาด">แจ้งลาช้า</span>':(lv?' <span class="lvtag">แจ้งลา</span>':''))+'</div><div class="at-btns">'
        +['มา','ขาด','ลา'].map(function(s){
          return '<button type="button" class="at-b '+(s==='มา'?'ok':(s==='ลา'?'lv':'ab'))+(AT.st[i]===s?' on':'')+'" data-m="at-set" data-i="'+i+'" data-s="'+s+'">'+s+'</button>';
        }).join('')+'</div></div>';

      +(AT.source==='draft'?'<div class="hint" style="display:block">กระดานนี้ยังไม่ได้เผยแพร่ ใช้รายชื่อฉบับร่าง</div>':'')
      +'<div class="at-list">'+rows+'</div>'
      +'<div class="btnrow" style="margin-top:12px"><button type="button" class="btn sm ghost" data-m="at-auto">เติมอัตโนมัติ (คนลา = ลา, ที่เหลือ = มา · แจ้งลาช้าเลือกเอง)</button>'
      +'<button type="button" class="btn sm" data-m="at-save">บันทึกการเช็คชื่อ</button></div><div class="msg" id="atMsg" role="status"></div>';
  }
  document.getElementById('adModal').addEventListener('click', function(e){

      paintAttend();
